version: v2
# The plugins come from the dev shell, so generation needs no network access.
plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/trevex/chalkos
  - local: protoc-gen-connect-go
    out: .
    opt: module=github.com/trevex/chalkos
  # The node API's reference page.
  - local: protoc-gen-doc
    out: docs/reference
    opt: api/markdown.tmpl,api.md
    strategy: all
