# Builds the flake's checks by the tiers of nix/checks/tiers.nix: the fast checks in one job, and
# each image and end-to-end check in a job of its own. A ready pull request runs the fast and
# image tiers, and the end-to-end checks its labels name: e2e names them all, and each other label
# the checks e2eLabels of the tiers maps it to; adding any label runs the workflow again. Every
# run but a draft's also runs govulncheck, which reads the Go vulnerability database from the
# network and so runs outside the flake's checks. A pull request's title, which a squash merge
# makes the subject of its commit on main, must be a Conventional Commit, and each of its commits
# must carry its author's DCO sign-off. Editing the title or the description runs the workflow
# again. A draft pull request runs only those two jobs and lint, which builds the tiers' lint
# checks, and fails result; marking it ready for review runs the workflow again with everything. A push to main runs
# the fast and image tiers, and the nightly run, which calls this workflow, runs every tier; both
# open or update an issue labelled ci-failure when a check fails, and one labelled flaky when a
# check passes only on its retry. The job result is the one check that branch protection requires.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_call:

# A pull request's newer run cancels its older one, also when an edit or a change between draft
# and ready starts it; the newer run substitutes from the cache what the older one built. Every
# commit on main runs to its end.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # A draft pull request runs no tier; its check jobs skip with this job.
  tiers:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      # Each job's timeout in minutes is its tier's, below the six hours the cache's token lasts.
      # A push to main runs no end-to-end check; the nightly run, whose event is schedule or
      # workflow_dispatch, runs them all.
      - name: List the checks to build
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          tiers=$(nix eval --json .#ciTiers.x86_64-linux)
          if [ "$EVENT" = push ]; then
            e2e='[]'
          elif [ "$EVENT" != pull_request ] || jq -e 'any(. == "e2e")' <<<"$LABELS" >/dev/null; then
            e2e=$(jq -c .e2e <<<"$tiers")
          else
            e2e=$(jq -c --argjson labels "$LABELS" \
              '[.e2eLabels | to_entries[] | select(.key as $label | $labels | any(. == $label)) | .value[]] | unique' \
              <<<"$tiers")
          fi
          matrix=$(jq -c --argjson e2e "$e2e" '{include: (
            [{name: "fast", checks: (.fast | join(" ")), timeout: 90}]
            + [.images[] | {name: ., checks: ., timeout: 120}]
            + [$e2e[] | {name: ., checks: ., timeout: 180}]
          )}' <<<"$tiers")
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          jq . <<<"$matrix"

  check:
    needs: tiers
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      # Hestia checks which cached packs GitHub has evicted.
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tiers.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nix with KVM and the binary caches. Every run reads the Cachix cache once the repository
      # names it in the variable CACHIX_NAME, and runs on main push to it with the secret
      # CACHIX_AUTH_TOKEN. Every run writes what it builds to Hestia's cache in the GitHub
      # Actions cache, in its branch's scope.
      - uses: ./.github/actions/nix
        with:
          cachix-name: ${{ vars.CACHIX_NAME }}
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      # A build that fails is built once more, which rebuilds only what failed, since a download
      # from a module proxy or registry fails now and then. A retry that passes is no silent pass:
      # the run's summary and a warning name what failed first, and on main and in the nightly run
      # report comments it on the issue labelled flaky, as a test that fails and then passes is
      # flaky.
      - name: Build ${{ matrix.name }}
        id: build
        env:
          CHECKS: ${{ matrix.checks }}
          NAME: ${{ matrix.name }}
        run: |
          set -o pipefail
          read -ra checks <<<"$CHECKS"
          installables=("${checks[@]/#/.#checks.x86_64-linux.}")
          if nix build --print-build-logs --no-link --keep-going "${installables[@]}" 2>&1 | tee first.log; then
            exit 0
          fi
          echo "::warning title=Retried $NAME::the build of $NAME failed; building it once more"
          nix build --print-build-logs --no-link --keep-going "${installables[@]}"
          .github/scripts/retried.sh "$NAME" first.log >"retried-$NAME.md"
          cat "retried-$NAME.md" >>"$GITHUB_STEP_SUMMARY"
          echo "::warning title=Flaky $NAME::$NAME passed only on its retry; the run's summary names what failed first"
          echo "retried=true" >>"$GITHUB_OUTPUT"
      - name: Keep what failed before the retry
        if: steps.build.outputs.retried == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retried-${{ matrix.name }}
          path: retried-${{ matrix.name }}.md
          retention-days: 7

  # A draft pull request builds the lint checks of the tiers, which belong to the fast tier too,
  # and no other; a ready one builds them in the fast job.
  lint:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Hestia checks which cached packs GitHub has evicted.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
        with:
          cachix-name: ${{ vars.CACHIX_NAME }}
      - name: Build the lint checks
        run: |
          mapfile -t checks < <(nix eval --json .#ciTiers.x86_64-linux.lint | jq -r '.[]')
          installables=("${checks[@]/#/.#checks.x86_64-linux.}")
          nix build --print-build-logs --no-link --keep-going "${installables[@]}"

  # govulncheck checks the Go code against the Go vulnerability database, which it reads from
  # vuln.go.dev, and fails when the code calls a function with a known vulnerability; one in a
  # module the code requires but does not call passes. The database changes every day, so the
  # nightly run also finds a new advisory against main.
  govulncheck:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Hestia checks which cached packs GitHub has evicted.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
        with:
          cachix-name: ${{ vars.CACHIX_NAME }}
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Check for vulnerabilities the Go code calls
        run: nix run .#govulncheck

  # The release pull request holds exactly one commit, release-please's, on the tip of its base.
  # Its versioned files and changelog are then those of every pull request merged before it.
  # GitHub runs no check again when main moves; release-please rebuilds the pull request then,
  # and branch protection, which wants branches up to date, holds the merge until it has.
  # "Update branch" adds a merge commit with main's changes but none of the release's, which this
  # job refuses. Every other pull request skips it, and so does the release pull request while it
  # is a draft.
  release-pr:
    if: github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check the release pull request's commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.base_ref }}
          # The commits of release-please, which acts as the release GitHub App's bot.
          RELEASE_BOT: 359050260+chalkreleaser[bot]@users.noreply.github.com
        run: |
          commit=$(gh api "repos/$GH_REPO/commits/$HEAD" --jq '{author: .commit.author.email, parents: [.parents[].sha]}')
          author=$(jq -r .author <<<"$commit")
          parents=$(jq -r '.parents | join(" ")' <<<"$commit")
          tip=$(gh api "repos/$GH_REPO/git/ref/heads/$BASE" --jq .object.sha)
          echo "head $HEAD by $author, parents $parents; $BASE is at $tip"
          if [ "$author" != "$RELEASE_BOT" ] || [ "$(wc -w <<<"$parents")" != 1 ]; then
            echo "::error title=Not release-please's commit::the release pull request has a commit release-please did not make, such as a merge from Update branch; keep the pull request open, and push to $BASE or run the release workflow again so that release-please rebuilds it"
            exit 1
          fi
          if [ "$parents" != "$tip" ]; then
            echo "::error title=Older $BASE::the release pull request was built on an older $BASE; release-please rebuilds it within a minute of a push to $BASE"
            exit 1
          fi

  # A squash merge makes the pull request's title the subject of its commit on main, from which
  # release-please writes the changelog.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/pr-title.sh "$TITLE"

  # Each commit of a pull request carries a Signed-off-by trailer of its author, which certifies
  # the Developer Certificate of Origin; the commits of Renovate and the release App's bot need
  # none.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/dco.sh "$BASE" "$HEAD"

  # The jobs that run on pull requests alone pass on a push or the nightly run when skipped. On a
  # draft pull request this job fails at once. Branch protection counts a skipped job as passed,
  # and GitHub keeps a commit's older checks, so a skipped result of the draft's run would pass
  # the required check while the run that "Ready for review" starts has yet to report its own,
  # and a passed result of a ready run would still show after "Convert to draft".
  result:
    needs: [tiers, check, govulncheck, release-pr, pr-title, dco]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          EVENT: ${{ github.event_name }}
          TIERS: ${{ needs.tiers.result }}
          CHECK: ${{ needs.check.result }}
          GOVULNCHECK: ${{ needs.govulncheck.result }}
          RELEASE_PR: ${{ needs.release-pr.result }}
          PR_TITLE: ${{ needs.pr-title.result }}
          DCO: ${{ needs.dco.result }}
        run: |
          if [ "$DRAFT" = true ]; then
            echo "::error title=Draft::a draft pull request runs only dco, pr-title and lint; mark it ready for review to run every check"
            exit 1
          fi
          echo "tiers: $TIERS, checks: $CHECK, govulncheck: $GOVULNCHECK, release pull request: $RELEASE_PR, title: $PR_TITLE, sign-offs: $DCO"
          passed() { [ "$1" = success ] || { [ "$EVENT" != pull_request ] && [ "$1" = skipped ]; }; }
          [ "$TIERS" = success ] && [ "$CHECK" = success ] && [ "$GOVULNCHECK" = success ] &&
            { [ "$RELEASE_PR" = success ] || [ "$RELEASE_PR" = skipped ]; } &&
            passed "$PR_TITLE" && passed "$DCO"

  # A failed check opens or updates the issue labelled ci-failure, and a check that passed only on
  # its retry the issue labelled flaky.
  report:
    needs: [tiers, check, govulncheck]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        if: contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: "The ${{ github.event_name }} run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} of ${{ github.sha }} failed."
        run: |
          number=$(gh issue list --label ci-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$BODY"
          else
            gh issue create --title "CI fails on main" --label ci-failure --body "$BODY"
          fi
      - name: Collect the checks that passed on their retry
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: retried-*
          path: retried
          merge-multiple: true
      - name: Open or update the issue of flaky checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INTRO: "The ${{ github.event_name }} run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} of ${{ github.sha }} passed these checks only on their retry."
        run: |
          shopt -s nullglob
          reports=(retried/*.md)
          if [ "${#reports[@]}" = 0 ]; then
            exit 0
          fi
          body=$(printf '%s\n\n' "$INTRO"; cat "${reports[@]}")
          number=$(gh issue list --label flaky --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Flaky checks" --label flaky --body "$body"
          fi
