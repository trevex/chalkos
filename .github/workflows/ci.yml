# Builds the flake's checks by the tiers of nix/checks/tiers.nix: the fast checks in one job, and
# each image and end-to-end check in a job of its own. A pull request runs the fast and image
# tiers, and the end-to-end checks its labels name: e2e names them all, e2e:<name> the check
# e2e-<name>; adding any label runs the workflow again. A push to main and the nightly run, which
# calls this workflow, run every tier and open or update an issue labelled ci-failure when a
# check fails. The job result is the one check that branch protection requires.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_call:

# A pull request's newer run cancels its older one; every commit on main runs to its end.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  tiers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      cache-key: ${{ steps.matrix.outputs.cache-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # Each job's timeout in minutes is its tier's. The base store's key changes with the Nix
      # code, the flake's inputs and the Go modules.
      - name: List the checks to build
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          CACHE_KEY: nix-base-${{ hashFiles('flake.lock', 'go.mod', 'go.sum', '**/*.nix') }}
        run: |
          echo "cache-key=$CACHE_KEY" >>"$GITHUB_OUTPUT"
          tiers=$(nix eval --json .#ciTiers.x86_64-linux)
          if [ "$EVENT" != pull_request ] || jq -e 'any(. == "e2e")' <<<"$LABELS" >/dev/null; then
            e2e=$(jq -c .e2e <<<"$tiers")
          else
            e2e=$(jq -c --argjson labels "$LABELS" \
              '[.e2e[] | select(("e2e:" + ltrimstr("e2e-")) as $label | $labels | any(. == $label))]' \
              <<<"$tiers")
          fi
          matrix=$(jq -c --argjson e2e "$e2e" '{include: (
            [{name: "fast", checks: (.fast | join(" ")), timeout: 90}]
            + [.images[] | {name: ., checks: ., timeout: 120}]
            + [$e2e[] | {name: ., checks: ., timeout: 180}]
          )}' <<<"$tiers")
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          jq . <<<"$matrix"

  check:
    needs: tiers
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tiers.outputs.matrix) }}
    steps:
      # The images and the store of a VM test take more than the runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /
      # The Nix daemon's build users run the VM tests, and the namespace checks run bubblewrap,
      # which Ubuntu's AppArmor keeps from unprivileged user namespaces.
      - name: Enable KVM and user namespaces
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            system-features = kvm nixos-test benchmark big-parallel
      # The base store every job starts from: the development shell, the Go modules, the
      # Kubernetes releases and the test registry's images. The fast job on main saves it; the
      # cache job removes older ones.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: ${{ needs.tiers.outputs.cache-key }}
          restore-prefixes-first-match: nix-base-
          save: ${{ matrix.name == 'fast' && github.ref == 'refs/heads/main' }}
      # A Cachix cache once the repository names it in the variable CACHIX_NAME: every run reads
      # it, and runs on main push to it with the secret CACHIX_AUTH_TOKEN.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_NAME != ''
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.ref != 'refs/heads/main' }}
      # A build that fails is built once more, which rebuilds only what failed, since a download
      # from a module proxy or registry fails now and then.
      - name: Build ${{ matrix.name }}
        env:
          CHECKS: ${{ matrix.checks }}
          NAME: ${{ matrix.name }}
        run: |
          read -ra checks <<<"$CHECKS"
          installables=("${checks[@]/#/.#checks.x86_64-linux.}")
          if ! nix build --print-build-logs --no-link --keep-going "${installables[@]}"; then
            echo "::warning title=Retried $NAME::the build of $NAME failed; building it once more"
            nix build --print-build-logs --no-link --keep-going "${installables[@]}"
          fi
      # The base store holds the roots alone, about 3 GiB, before the cache action saves it.
      - name: Keep the base store
        if: matrix.name == 'fast' && github.ref == 'refs/heads/main'
        run: |
          roots=$RUNNER_TEMP/roots
          mkdir -p "$roots"
          nix develop --profile "$roots/dev-shell" --command true
          nix build --out-link "$roots/go-modules" .#packages.x86_64-linux.chalkctl.goModules
          nix build --out-link "$roots/kubelet-releases" .#kubelet-releases
          nix build --out-link "$roots/test-kubernetes-images" .#test-kubernetes-images
          nix store gc
          du -sh /nix/store

  # On main, removes the base stores of other keys than this run's, after the fast job saved it.
  cache:
    needs: [tiers, check]
    if: github.ref == 'refs/heads/main' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Remove older base stores
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ needs.tiers.outputs.cache-key }}
        run: |
          gh cache list --key nix- --limit 100 --json key --jq '.[].key' | sort -u | while read -r key; do
            if [ "$key" != "$KEEP" ]; then
              gh cache delete "$key"
            fi
          done

  result:
    needs: [tiers, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        env:
          TIERS: ${{ needs.tiers.result }}
          CHECK: ${{ needs.check.result }}
        run: |
          echo "tiers: $TIERS, checks: $CHECK"
          [ "$TIERS" = success ] && [ "$CHECK" = success ]

  report:
    needs: [tiers, check]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: "The ${{ github.event_name }} run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} of ${{ github.sha }} failed."
        run: |
          number=$(gh issue list --label ci-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$BODY"
          else
            gh issue create --title "CI fails on main" --label ci-failure --body "$BODY"
          fi
