# Builds the flake's checks by the tiers of nix/checks/tiers.nix: the fast checks in one job, and
# each image and end-to-end check in a job of its own. A pull request runs the fast and image
# tiers, and the end-to-end checks its labels name: e2e names them all, and each other label the
# checks e2eLabels of the tiers maps it to; adding any label runs the workflow again. A push to main and the nightly run, which
# calls this workflow, run every tier and open or update an issue labelled ci-failure when a
# check fails. The job result is the one check that branch protection requires.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_call:

# A pull request's newer run cancels its older one; every commit on main runs to its end.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  tiers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # Each job's timeout in minutes is its tier's, below the six hours the cache's token lasts.
      - name: List the checks to build
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          tiers=$(nix eval --json .#ciTiers.x86_64-linux)
          if [ "$EVENT" != pull_request ] || jq -e 'any(. == "e2e")' <<<"$LABELS" >/dev/null; then
            e2e=$(jq -c .e2e <<<"$tiers")
          else
            e2e=$(jq -c --argjson labels "$LABELS" \
              '[.e2eLabels | to_entries[] | select(.key as $label | $labels | any(. == $label)) | .value[]] | unique' \
              <<<"$tiers")
          fi
          matrix=$(jq -c --argjson e2e "$e2e" '{include: (
            [{name: "fast", checks: (.fast | join(" ")), timeout: 90}]
            + [.images[] | {name: ., checks: ., timeout: 120}]
            + [$e2e[] | {name: ., checks: ., timeout: 180}]
          )}' <<<"$tiers")
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          jq . <<<"$matrix"

  check:
    needs: tiers
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      # Hestia checks which cached packs GitHub has evicted.
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tiers.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nix with KVM and the binary caches. Every run reads the Cachix cache once the repository
      # names it in the variable CACHIX_NAME, and runs on main push to it with the secret
      # CACHIX_AUTH_TOKEN. Every run writes what it builds to Hestia's cache in the GitHub
      # Actions cache, in its branch's scope.
      - uses: ./.github/actions/nix
        with:
          cachix-name: ${{ vars.CACHIX_NAME }}
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      # A build that fails is built once more, which rebuilds only what failed, since a download
      # from a module proxy or registry fails now and then.
      - name: Build ${{ matrix.name }}
        env:
          CHECKS: ${{ matrix.checks }}
          NAME: ${{ matrix.name }}
        run: |
          read -ra checks <<<"$CHECKS"
          installables=("${checks[@]/#/.#checks.x86_64-linux.}")
          if ! nix build --print-build-logs --no-link --keep-going "${installables[@]}"; then
            echo "::warning title=Retried $NAME::the build of $NAME failed; building it once more"
            nix build --print-build-logs --no-link --keep-going "${installables[@]}"
          fi

  result:
    needs: [tiers, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        env:
          TIERS: ${{ needs.tiers.result }}
          CHECK: ${{ needs.check.result }}
        run: |
          echo "tiers: $TIERS, checks: $CHECK"
          [ "$TIERS" = success ] && [ "$CHECK" = success ]

  report:
    needs: [tiers, check]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: "The ${{ github.event_name }} run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} of ${{ github.sha }} failed."
        run: |
          number=$(gh issue list --label ci-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$BODY"
          else
            gh issue create --title "CI fails on main" --label ci-failure --body "$BODY"
          fi
