# Builds the flake's checks by the tiers of nix/checks/tiers.nix: the fast checks in one job, and
# each image and end-to-end check in a job of its own. A pull request runs the fast and image
# tiers, and the end-to-end checks its labels name: e2e names them all, and each other label the
# checks e2eLabels of the tiers maps it to; adding any label runs the workflow again. A pull
# request's title, which a squash merge makes the subject of its commit on main, must be a
# Conventional Commit, and each of its commits must carry its author's DCO sign-off. Editing the
# title or the description runs the workflow again. A push to main and the nightly run, which
# calls this workflow, run every tier and open or update an issue labelled ci-failure when a
# check fails. The job result is the one check that branch protection requires.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_call:

# A pull request's newer run cancels its older one, also when an edit starts it; the newer run
# substitutes from the cache what the older one built. Every commit on main runs to its end.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  tiers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # Each job's timeout in minutes is its tier's, below the six hours the cache's token lasts.
      - name: List the checks to build
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          tiers=$(nix eval --json .#ciTiers.x86_64-linux)
          if [ "$EVENT" != pull_request ] || jq -e 'any(. == "e2e")' <<<"$LABELS" >/dev/null; then
            e2e=$(jq -c .e2e <<<"$tiers")
          else
            e2e=$(jq -c --argjson labels "$LABELS" \
              '[.e2eLabels | to_entries[] | select(.key as $label | $labels | any(. == $label)) | .value[]] | unique' \
              <<<"$tiers")
          fi
          matrix=$(jq -c --argjson e2e "$e2e" '{include: (
            [{name: "fast", checks: (.fast | join(" ")), timeout: 90}]
            + [.images[] | {name: ., checks: ., timeout: 120}]
            + [$e2e[] | {name: ., checks: ., timeout: 180}]
          )}' <<<"$tiers")
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          jq . <<<"$matrix"

  check:
    needs: tiers
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      # Hestia checks which cached packs GitHub has evicted.
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tiers.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nix with KVM and the binary caches. Every run reads the Cachix cache once the repository
      # names it in the variable CACHIX_NAME, and runs on main push to it with the secret
      # CACHIX_AUTH_TOKEN. Every run writes what it builds to Hestia's cache in the GitHub
      # Actions cache, in its branch's scope.
      - uses: ./.github/actions/nix
        with:
          cachix-name: ${{ vars.CACHIX_NAME }}
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      # A build that fails is built once more, which rebuilds only what failed, since a download
      # from a module proxy or registry fails now and then.
      - name: Build ${{ matrix.name }}
        env:
          CHECKS: ${{ matrix.checks }}
          NAME: ${{ matrix.name }}
        run: |
          read -ra checks <<<"$CHECKS"
          installables=("${checks[@]/#/.#checks.x86_64-linux.}")
          if ! nix build --print-build-logs --no-link --keep-going "${installables[@]}"; then
            echo "::warning title=Retried $NAME::the build of $NAME failed; building it once more"
            nix build --print-build-logs --no-link --keep-going "${installables[@]}"
          fi

  # The release pull request holds exactly one commit, release-please's, on the tip of its base.
  # Its versioned files and changelog are then those of every pull request merged before it.
  # GitHub runs no check again when main moves; release-please rebuilds the pull request then,
  # and branch protection, which wants branches up to date, holds the merge until it has.
  # "Update branch" adds a merge commit with main's changes but none of the release's, which this
  # job refuses. Every other pull request skips it.
  release-pr:
    if: github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check the release pull request's commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.base_ref }}
          # The commits of release-please, which acts as the release GitHub App's bot.
          RELEASE_BOT: 359050260+chalkreleaser[bot]@users.noreply.github.com
        run: |
          commit=$(gh api "repos/$GH_REPO/commits/$HEAD" --jq '{author: .commit.author.email, parents: [.parents[].sha]}')
          author=$(jq -r .author <<<"$commit")
          parents=$(jq -r '.parents | join(" ")' <<<"$commit")
          tip=$(gh api "repos/$GH_REPO/git/ref/heads/$BASE" --jq .object.sha)
          echo "head $HEAD by $author, parents $parents; $BASE is at $tip"
          if [ "$author" != "$RELEASE_BOT" ] || [ "$(wc -w <<<"$parents")" != 1 ]; then
            echo "::error title=Not release-please's commit::the release pull request has a commit release-please did not make, such as a merge from Update branch; keep the pull request open, and push to $BASE or run the release workflow again so that release-please rebuilds it"
            exit 1
          fi
          if [ "$parents" != "$tip" ]; then
            echo "::error title=Older $BASE::the release pull request was built on an older $BASE; release-please rebuilds it within a minute of a push to $BASE"
            exit 1
          fi

  # A squash merge makes the pull request's title the subject of its commit on main, from which
  # release-please writes the changelog.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/pr-title.sh "$TITLE"

  # Each commit of a pull request carries a Signed-off-by trailer of its author, which certifies
  # the Developer Certificate of Origin; the commits of Renovate and the release App's bot need
  # none.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/dco.sh "$BASE" "$HEAD"

  # The jobs that run on pull requests alone pass on a push or the nightly run when skipped.
  result:
    needs: [tiers, check, release-pr, pr-title, dco]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        env:
          EVENT: ${{ github.event_name }}
          TIERS: ${{ needs.tiers.result }}
          CHECK: ${{ needs.check.result }}
          RELEASE_PR: ${{ needs.release-pr.result }}
          PR_TITLE: ${{ needs.pr-title.result }}
          DCO: ${{ needs.dco.result }}
        run: |
          echo "tiers: $TIERS, checks: $CHECK, release pull request: $RELEASE_PR, title: $PR_TITLE, sign-offs: $DCO"
          passed() { [ "$1" = success ] || { [ "$EVENT" != pull_request ] && [ "$1" = skipped ]; }; }
          [ "$TIERS" = success ] && [ "$CHECK" = success ] &&
            { [ "$RELEASE_PR" = success ] || [ "$RELEASE_PR" = skipped ]; } &&
            passed "$PR_TITLE" && passed "$DCO"

  report:
    needs: [tiers, check]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: "The ${{ github.event_name }} run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} of ${{ github.sha }} failed."
        run: |
          number=$(gh issue list --label ci-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$BODY"
          else
            gh issue create --title "CI fails on main" --label ci-failure --body "$BODY"
          fi
