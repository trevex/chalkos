# Builds the documentation site with Nix and publishes it on GitHub Pages, on every push to main.
# The site is the flake's docs package, the same strict build as the docs check. The actions are
# pinned to commits, so a moved tag cannot change what runs with the Pages token.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; one that runs finishes before the next starts.
concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build the site
        run: cp -r --no-preserve=mode "$(nix build --no-link --print-out-paths --print-build-logs .#docs)" site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
