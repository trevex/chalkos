# Runs every tier of the CI workflow on main each night, end-to-end checks included, which no push
# to main runs. A scheduled run skips CI when an earlier nightly run already passed it on main's
# latest commit, as after a night with no push; a run started by hand always builds. A failing
# check opens or updates the issue labelled ci-failure. Forks do not run it.
name: nightly

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions: {}

jobs:
  # A nightly run that passed has the job "ci / result" with the conclusion success; a run that
  # skipped CI has none, so the run that passed stays the one that counts.
  tested:
    if: github.repository == 'trevex/chalkos'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.main.outputs.passed }}
    steps:
      - name: Look for a passed nightly run of main's latest commit
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          passed=false
          if [ "$EVENT" = schedule ]; then
            for run in $(gh run list --workflow nightly.yml --branch main --commit "$SHA" --limit 50 \
              --json databaseId --jq '.[].databaseId'); do
              result=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run/jobs?per_page=100" \
                --jq '.jobs[] | select(.name == "ci / result" and .conclusion == "success") | .id')
              if [ -n "$result" ]; then
                echo "The nightly run $run already passed CI on $SHA."
                passed=true
                break
              fi
            done
          fi
          echo "passed=$passed" >>"$GITHUB_OUTPUT"

  ci:
    needs: tested
    if: needs.tested.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: read
      contents: read
      issues: write
    secrets: inherit

  # vulnix matches the packages of each release image's NixOS system, its runtime closure, against
  # the National Vulnerability Database's CVEs, which it downloads, every night, whether or not CI
  # ran. It reports what it finds in the run's summary and as the artifact vulnix, one JSON file
  # per image, and fails only when it cannot scan; the job vulnix-issue opens an issue for a
  # high-score match. A CVE in nixpkgs's packages is fixed by an update of nixpkgs, not by
  # holding the nightly run. .github/vulnix-whitelist.toml holds the matches judged not to apply,
  # each with its reason.
  vulnix:
    if: github.repository == 'trevex/chalkos'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # Hestia checks which cached packs GitHub has evicted.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The images' systems come from the caches that CI's release-image checks fill on main.
      - uses: ./.github/actions/nix
        with:
          cachix-name: ${{ vars.CACHIX_NAME }}
          read-only: "true"
      - name: Build the release images' systems
        run: |
          mkdir systems
          for name in $(nix eval --json .#releaseImages.x86_64-linux --apply builtins.attrNames | jq -r '.[]'); do
            nix build --print-build-logs -o "systems/$name" \
              ".#releaseImages.x86_64-linux.\"$name\".nixos.config.system.build.toplevel"
          done
      # vulnix exits with 2 when it finds a CVE the whitelist does not hold, and with 1 when it
      # fails.
      - name: Scan the systems
        run: |
          mkdir reports
          for system in systems/*; do
            name=$(basename "$system")
            status=0
            nix run --inputs-from . nixpkgs#vulnix -- --closure --json \
              --whitelist .github/vulnix-whitelist.toml "$system" >"reports/$name.json" || status=$?
            if [ "$status" != 0 ] && [ "$status" != 2 ]; then
              echo "::error title=vulnix failed::vulnix could not scan $name"
              exit 1
            fi
          done
      - name: Summarise the findings
        run: |
          {
            echo "# vulnix"
            echo
            echo "| Image | Packages | CVEs |"
            echo "| --- | ---: | ---: |"
            for report in reports/*.json; do
              jq -r --arg name "$(basename "$report" .json)" \
                '"| \($name) | \(length) | \([.[].affected_by[]] | unique | length) |"' "$report"
            done
            echo
            echo "The packages of every image, with the CVEs vulnix matches to each and the highest CVSS v3 score among them:"
            echo
            echo "| Package | CVEs | Highest CVSS v3 |"
            echo "| --- | --- | ---: |"
            jq -rs 'add // [] | unique_by(.name) | sort_by(-([.cvssv3_basescore[]] | max // 0))[]
              | "| \(.name) | \(.affected_by | join(", ")) | \([.cvssv3_basescore[]] | max // "") |"' reports/*.json
          } >>"$GITHUB_STEP_SUMMARY"
          total=$(jq -s '[.[][].affected_by[]] | unique | length' reports/*.json)
          echo "::notice title=vulnix::$total CVEs match the packages of the release images; see the run's summary"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnix
          path: reports

  # Opens the issue labelled security that lists the vulnix matches with a CVSS v3 score of 7 or
  # more, or comments on the open one when the scan finds a match it does not list. A run with no
  # new match leaves the issue as it is, and the job never closes it: closing it acknowledges the
  # matches it lists, and the next new match opens another. It runs apart from the scan so that
  # issues: write stays away from the Nix action.
  vulnix-issue:
    needs: vulnix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vulnix
          path: reports
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="vulnix matches high-score CVEs in the release images"
          # The newest issue of that title, open or closed, holds the matches already reported.
          issues=$(gh issue list --label security --state all --limit 100 --json number,title,state)
          number=$(jq -r --arg title "$title" 'map(select(.title == $title)) | .[0].number // empty' <<<"$issues")
          state=$(jq -r --arg title "$title" 'map(select(.title == $title)) | .[0].state // empty' <<<"$issues")
          if [ -n "$number" ]; then
            gh issue view "$number" --json body --jq .body >previous.md
          else
            : >previous.md
          fi
          .github/scripts/vulnix-issue.sh reports previous.md new.md >body.md
          printf '\nThe nightly run %s found these matches.\n' "$RUN" >>body.md
          if [ ! -s new.md ]; then
            echo "No new match with a CVSS v3 score of 7 or more."
          elif [ "$state" = OPEN ]; then
            gh issue edit "$number" --body-file body.md
            {
              echo "The nightly run $RUN found matches the issue did not list:"
              echo
              echo "| Image | Package | CVE | CVSS v3 |"
              echo "| --- | --- | --- | ---: |"
              cat new.md
            } | gh issue comment "$number" --body-file -
          else
            gh issue create --title "$title" --label security --body-file body.md
          fi
