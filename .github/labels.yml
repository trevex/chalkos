# The repository's labels, which the labels workflow creates or updates on a push to main. The
# check ci-tiers wants the label e2e and each label of e2eLabels in nix/checks/tiers.nix.
- name: e2e
  color: "5319e7"
  description: Run every end-to-end test on this pull request
- name: e2e:image
  color: "d4c5f9"
  description: Run the e2e-image check on this pull request
- name: e2e:secureboot
  color: "d4c5f9"
  description: Run the e2e-secureboot check on this pull request
- name: e2e:install
  color: "d4c5f9"
  description: Run the e2e-install check on this pull request
- name: e2e:installer
  color: "d4c5f9"
  description: Run the e2e-installer check on this pull request
- name: e2e:iso
  color: "d4c5f9"
  description: Run the e2e-iso check on this pull request
- name: e2e:upgrade
  color: "d4c5f9"
  description: Run the e2e-upgrade check on this pull request
- name: e2e:kubernetes
  color: "d4c5f9"
  description: Run the e2e-kubernetes check on this pull request
- name: e2e:kubernetes-ha
  color: "d4c5f9"
  description: Run the e2e-kubernetes-ha check on this pull request
- name: e2e:router
  color: "d4c5f9"
  description: Run the e2e-router check on this pull request
- name: e2e:examples
  color: "d4c5f9"
  description: Run the example checks, which build the examples' images, on this pull request
- name: e2e:release
  color: "d4c5f9"
  description: Run the checks that build the release images on this pull request
- name: ci-failure
  color: "b60205"
  description: CI failed on main or in the nightly run
- name: flaky
  color: "fbca04"
  description: A check failed on main or in the nightly run and passed on its retry
- name: dependencies
  color: "0366d6"
  description: Updates a dependency
- name: security
  color: "d93f0b"
  description: Fixes a known vulnerability
- name: release
  color: "0e8a16"
  description: Prepares a release
# release-please finds its open release pull request by autorelease: pending and e2e, and marks
# it autorelease: tagged once it has tagged the release.
- name: "autorelease: pending"
  color: "ededed"
  description: The release pull request, which release-please tags once it is merged
- name: "autorelease: tagged"
  color: "ededed"
  description: A merged release pull request whose release release-please has tagged
