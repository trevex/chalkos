# Prepares a runner to build the flake: frees disk space, opens KVM and user namespaces to the
# builds, installs Nix and wires up the binary caches. The ci and release workflows run it after
# the checkout.
name: nix
description: Install Nix with KVM and the binary caches

inputs:
  cachix-name:
    description: The Cachix cache to read; none when empty
    required: false
    default: ""
  cachix-auth-token:
    description: The token that pushes to the Cachix cache; the job pushes nothing to it when empty
    required: false
    default: ""
  read-only:
    description: Whether the job only reads the caches and writes nothing to them
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The images and the store of a VM test take more than the runner's free disk.
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
        df -h /
    # The Nix daemon's build users run the VM tests, and the namespace checks run bubblewrap,
    # which Ubuntu's AppArmor keeps from unprivileged user namespaces.
    - name: Enable KVM and user namespaces
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
    - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        extra_nix_config: |
          system-features = kvm nixos-test benchmark big-parallel
    # A Cachix cache once the repository names it: every job reads it, and a job with its token
    # pushes to it at its end rather than from a post-build hook, which Hestia holds.
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      if: inputs.cachix-name != ''
      with:
        name: ${{ inputs.cachix-name }}
        authToken: ${{ inputs.cachix-auth-token }}
        skipPush: ${{ inputs.read-only == 'true' || inputs.cachix-auth-token == '' }}
        useDaemon: false
    # The binary cache in the GitHub Actions cache: a job substitutes what main's runs and its
    # pull request's earlier runs built and, unless it only reads, uploads what it builds when it
    # ends. Paths cache.nixos.org signs stay out of it.
    - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
      with:
        version: v3.1.0
        upstream-cache-filter: true
        drain-timeout: 900
        read-only: ${{ inputs.read-only }}
