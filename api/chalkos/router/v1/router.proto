syntax = "proto3";

// The API of chalkd's router layer, which chalkd serves beside the node API on images with the
// router layer, on the same port and with the same certificates and roles.
package chalkos.router.v1;

option go_package = "github.com/trevex/chalkos/pkg/api/router/v1;routerv1";

// RouterService is the API of the node's router side. Each method's comment names the modes it is
// available in and the least role a client certificate needs, as on NodeService. On an image
// without the router layer every method fails with UNIMPLEMENTED, before the mode and the role are
// checked.
service RouterService {
  // Status reports the state of the router's routing daemons, its NAT64 instances, its resolvers
  // and its DHCP servers. Available in normal mode to readers, on images with the router layer.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Routes lists the routes in the node's kernel, of the main table unless a VRF or another table
  // is asked for, and the paths the BGP instance of that VRF selected, each within an address
  // range when one is given. Available in normal mode to readers, on images with the router
  // layer.
  rpc Routes(RoutesRequest) returns (RoutesResponse);
}

// The request of Status.
message StatusRequest {}

// The response of Status: the state of a router's routing daemons, its NAT64 instances, its
// resolvers and its DHCP servers.
message StatusResponse {
  // The router's BGP sessions, by VRF, the default first, then by BGPPeer document and by
  // interface or address.
  repeated BGPPeerStatus peers = 1;
  // Why FRR's BGP state could not be read, such as vtysh's error; empty when it was. peers is
  // then empty.
  string bgp_error = 2;
  // The router's NAT64 instances, one per Jool instance, which a NAT64 document names, by name.
  repeated NAT64Status nat64 = 3;
  // Why Jool's state could not be read, such as jool's error; empty when it was. nat64 is then
  // empty.
  string nat64_error = 4;
  // The resolver of the router's default VRF; unset on a router without one.
  ResolverStatus resolver = 5;
  // The resolvers of the router's VRFs, one per VRF with a Resolver document, by VRF.
  repeated ResolverStatus vrf_resolvers = 6;
  // The router's DHCP servers, one per VRF whose links DHCPSubnet documents serve, the default VRF's
  // first, then by VRF.
  repeated DHCPServerStatus dhcp = 7;
}

// One NAT64 instance of a router, as Jool reports it.
message NAT64Status {
  // Name of the NAT64 document, which names its instance.
  string name = 1;
  // Connections the instance translates, of all protocols.
  uint64 sessions = 2;
  // IPv4 addresses and ports of the pool that translated connections hold, of all protocols: one
  // per IPv6 address and port, or ICMP identifier, that the instance translates.
  uint64 bindings = 3;
  // The instance's pool for TCP, UDP and ICMP, in this order.
  repeated NAT64PoolStatus pools = 4;
}

// A NAT64 instance's pool of one protocol.
message NAT64PoolStatus {
  // The protocol: tcp, udp or icmp.
  string protocol = 1;
  // IPv4 addresses and ports, or ICMP identifiers, the pool holds for the protocol; 0 when it
  // holds none. An instance whose pool is empty takes the router's own addresses.
  uint64 size = 2;
}

// The state of a router's resolver.
message ResolverStatus {
  // Whether Unbound runs: the default VRF's answers on its control socket, and a VRF's unit is
  // active.
  bool running = 1;
  // Why Unbound does not run, such as unbound-control's error or the state of a VRF's unit; empty
  // while it runs.
  string error = 2;
  // The VRF whose resolver this is; empty for the default VRF's.
  string vrf = 3;
}

// A DHCP server of a router: Kea's DHCPv4 server of one VRF.
message DHCPServerStatus {
  // The VRF whose links the server serves: the name of its VRF document, or default.
  string vrf = 1;
  // The address family the server leases: ipv4.
  string family = 2;
  // Whether the server runs: its unit is active, bound to its VRF's device, and it answers on
  // its control socket.
  bool running = 3;
  // Why the server does not run, such as the state of its unit or why it did not answer; empty
  // while it runs.
  string error = 4;
  // The subnets the server serves, in the order of their documents; empty while it does not run.
  repeated DHCPSubnetStatus subnets = 5;
}

// A subnet of a DHCP server, as Kea counts its leases.
message DHCPSubnetStatus {
  // Name of the DHCPSubnet document.
  string name = 1;
  // The subnet's range, such as 192.0.2.0/24.
  string subnet = 2;
  // Addresses the server leased that have not expired, reserved ones included.
  uint64 leased = 3;
  // Addresses of the subnet's pools.
  uint64 pool = 4;
}

// One BGP session of a router: a BGPPeer's address, or one of its interfaces.
message BGPPeerStatus {
  // Name of the BGPPeer document.
  string name = 1;
  // The interface the session runs on, for a peer of interface or interfaces, or the neighbour's
  // address.
  string neighbor = 2;
  // The session's BGP state: Idle, Connect, Active, OpenSent, OpenConfirm or Established.
  string state = 3;
  // How long the session has been established, in seconds; 0 while it is not.
  uint64 uptime_seconds = 4;
  // Routes the router accepted from the neighbour, of every family.
  uint32 prefixes_received = 5;
  // Routes the router sends the neighbour, of every family.
  uint32 prefixes_sent = 6;
  // The state of the session's BFD: up, down, admin-down or unknown; empty for a peer without bfd.
  string bfd = 7;
  // The VRF the session runs in: the name of its VRF document, or default.
  string vrf = 8;
}

// The request of Routes.
message RoutesRequest {
  // An address range, such as 2001:db8::/32: only the routes to it and to ranges within it.
  // Empty for every route.
  string prefix = 1;
  // Only the kernel's routes of this protocol: kernel, boot, static, ra, dhcp, bgp or another the
  // kernel names, or its number. BGP's paths are listed for bgp and for an empty protocol alone.
  string protocol = 2;
  // The kernel's routing table: main, local, default, all, or a table's number. Empty for main, or
  // for the table of vrf.
  string table = 3;
  // The VRF whose routes to list, by the name of its VRF document, or default: the routes of its
  // table, which the node's running VRF document gives, and the paths of its BGP instance. Empty
  // for the default VRF. A request gives vrf or table, not both.
  string vrf = 4;
}

// The response of Routes.
message RoutesResponse {
  // The kernel's routes, in the order of their tables, families and destinations.
  repeated KernelRoute kernel = 1;
  // The paths BGP selected and installs, in the order of their families and prefixes.
  repeated BGPRoute bgp = 2;
  // Why BGP's paths could not be read, such as vtysh's error; empty when they were.
  string bgp_error = 3;
  // The VRF whose routes these are: the request's vrf, or default for a request without one. A
  // node whose image does not know VRFs leaves it empty and lists the main table and the default
  // instance's paths, whatever the request's vrf.
  string vrf = 4;
}

// A route in the kernel's routing tables.
message KernelRoute {
  // Destination address range, such as ::/0.
  string destination = 1;
  // The route's type: unicast, local, broadcast, anycast, multicast, blackhole, unreachable,
  // prohibit or throw, or its number.
  string type = 2;
  // What installed it: kernel, boot, static, ra, dhcp, bgp and others the kernel names, or its
  // number.
  string protocol = 3;
  // The routing table, by number: 254 is main, 255 local and 253 default.
  uint32 table = 4;
  // The route's metric.
  uint32 metric = 5;
  // Where the route leads; several for a route over equal-cost paths.
  repeated NextHop next_hops = 6;
}

// A next hop of a kernel route.
message NextHop {
  // The gateway's address, which may be of the other family; empty for a route on the link
  // alone.
  string gateway = 1;
  // The interface the route leaves through.
  string interface = 2;
  // The next hop's weight among several, from 1; 0 for a route of one next hop.
  uint32 weight = 3;
}

// A path of BGP's for a prefix, which its best path selection took.
message BGPRoute {
  // The prefix, such as ::/0.
  string prefix = 1;
  // The ASes of the path, separated by spaces; empty for a route the router originates.
  string as_path = 2;
  // The next hop addresses FRR resolved for the path.
  repeated string next_hops = 3;
  // The neighbour the path came from: its interface, for a session of an interface, or its
  // address; empty for a route the router originates.
  string peer = 4;
  // The path's local preference, when it carries one.
  optional uint32 local_pref = 5;
  // The path's multi-exit discriminator.
  uint32 med = 6;
  // The path's standard and large communities.
  repeated string communities = 7;
  // Whether it is the best path; otherwise one of the equal paths BGP installs beside it.
  bool best = 8;
  // The VRF whose BGP instance the path came from, through the importing instance's
  // spec.import, or the route distinguisher it came from when FRR names no VRF; empty for a
  // path of the instance's own peers or networks.
  string imported_from = 9;
}
