syntax = "proto3";

// The API of chalkd, the agent on every chalkos node and on the installer. chalkd serves it on
// TCP port 50000 over TLS; chalkctl is its client.
package chalkos.node.v1;

option go_package = "github.com/trevex/chalkos/pkg/api/node/v1;nodev1";

import "google/protobuf/timestamp.proto";

service NodeService {
  // Info describes the node and the agent. Available in both modes to readers.
  rpc Info(InfoRequest) returns (InfoResponse);
  // Disks lists the node's disks and their partitions. Available in both modes to readers.
  rpc Disks(DisksRequest) returns (DisksResponse);
  // Install turns a node in maintenance mode into an installed node and reboots it. The first
  // message carries the header; image chunks follow when the node is the installer.
  rpc Install(stream InstallRequest) returns (InstallResponse);
  // ApplyIdentity replaces the identity of an installed node. Destructive storage changes are
  // refused; additive ones are applied live.
  rpc ApplyIdentity(ApplyIdentityRequest) returns (ApplyIdentityResponse);
  // ResetVolume wipes one volume and creates it again as the delivered identity defines it.
  rpc ResetVolume(ResetVolumeRequest) returns (ResetVolumeResponse);
  // Status reports the identity version, the storage, and failed units of an installed node.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Logs streams the journal of the current boot, or of one unit in it.
  rpc Logs(LogsRequest) returns (stream LogsResponse);
  // Reboot reboots the node once the response is sent.
  rpc Reboot(RebootRequest) returns (RebootResponse);
  // Bootstrap initialises etcd on a control-plane node, starts the control plane and applies
  // the cluster's manifests. It is refused on a node that is bootstrapped or holds etcd data,
  // so no second cluster is ever initialised.
  rpc Bootstrap(BootstrapRequest) returns (BootstrapResponse);
  // EtcdMembers lists etcd's members as the node's own member sees them, with their health.
  // Available on control-plane nodes that are etcd members.
  rpc EtcdMembers(EtcdMembersRequest) returns (EtcdMembersResponse);
  // EtcdRemoveMember removes another node's etcd member. It is refused when the voters left would
  // have fewer healthy members than their quorum, unless forced.
  rpc EtcdRemoveMember(EtcdRemoveMemberRequest) returns (EtcdRemoveMemberResponse);
  // EtcdLeave takes the node out of etcd: it releases the VIPs, removes its own member, if etcd
  // still has it, with the same quorum guard, stops its control plane, deletes its etcd data and
  // unpins its addresses. The node joins the cluster again only once it is reinstalled. A
  // bootstrapped node whose own member does not answer leaves only when forced.
  rpc EtcdLeave(EtcdLeaveRequest) returns (EtcdLeaveResponse);
  // RenewNodeCertificate issues the calling node a node certificate from the node CA, for exactly
  // the names of the node certificate it authenticated with. Available on control-plane nodes, to
  // nodes only.
  rpc RenewNodeCertificate(RenewNodeCertificateRequest) returns (RenewNodeCertificateResponse);
  // RotationStep runs a step of a CA or key rotation that the node's Kubernetes side carries
  // out; chalkctl rotate calls it. Available to admins.
  rpc RotationStep(RotationStepRequest) returns (RotationStepResponse);
  // Upgrade installs a new image into the node's inactive slot, from which it boots next, counting
  // the image's boot tries until a boot is found healthy, and reboots the node when asked to.
  // The first message carries the header; the store, its hash tree and the UKI follow as
  // chunks. Available to operators.
  rpc Upgrade(stream UpgradeRequest) returns (UpgradeResponse);
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  // The node is not installed: chalkd serves a self-signed certificate.
  MODE_MAINTENANCE = 1;
  // The node is installed: chalkd serves its node certificate and requires client certificates.
  MODE_NORMAL = 2;
}

enum SecureBoot {
  SECURE_BOOT_UNSPECIFIED = 0;
  SECURE_BOOT_DISABLED = 1;
  SECURE_BOOT_ENABLED = 2;
  // The firmware accepts new Secure Boot keys without authentication.
  SECURE_BOOT_SETUP_MODE = 3;
}

message InfoRequest {}

message InfoResponse {
  Mode mode = 1;
  // chalkos version of the running image.
  string version = 2;
  // Image ID of the running image, such as "chalkos".
  string image_id = 3;
  // Whether the node runs the installer, which writes a role image to another disk.
  bool installer = 4;
  // Device of the disk the node booted from; empty on the installer booted from a CD.
  string boot_disk = 5;
  bool tpm = 6;
  SecureBoot secure_boot = 7;
  // SHA-256 of the certificate chalkd serves, in lower-case hex.
  string fingerprint = 8;
  string hostname = 9;
  // The cluster and role the running image was built for; empty on the installer.
  string cluster = 10;
  string role = 11;
}

message DisksRequest {}

message DisksResponse {
  repeated Disk disks = 1;
}

message Disk {
  // Kernel name, such as nvme0n1.
  string name = 1;
  string device = 2;
  string model = 3;
  uint64 size = 4;
  string serial = 5;
  string wwn = 6;
  // nvme, ssd or hdd.
  string type = 7;
  // udev's ID_PATH.
  string path = 8;
  repeated Partition partitions = 9;
  // How chalkos uses the disk: "boot" for the boot disk, "disk <name>" for a pinned disk of the
  // node's storage, empty when chalkos does not use it.
  string usage = 10;
}

message Partition {
  string device = 1;
  uint32 number = 2;
  uint64 size = 3;
  // GPT partition type UUID.
  string type = 4;
  string label = 5;
  string uuid = 6;
  // File system or other content blkid found, such as ext4 or crypto_LUKS.
  string content = 7;
}

message InstallRequest {
  oneof message {
    InstallHeader header = 1;
    ImageChunk chunk = 2;
  }
}

message InstallHeader {
  // The node's identity as the manifest renders it (JSON), including its storage section.
  string identity = 1;
  // PEM certificate and key chalkd serves once the node is installed.
  bytes node_certificate = 2;
  bytes node_key = 3;
  // PEM certificates of the OS CAs the node trusts, the one that issues client certificates and
  // the node CA first, then those still trusted while it rotates.
  bytes ca_certificate = 4;
  // Recovery key or password enrolled as the second keyslot of every encrypted volume; empty
  // when the node's fallback is none.
  string fallback_secret = 5;
  oneof target {
    // The role image already runs from the boot disk.
    InPlace in_place = 6;
    // The installer writes the streamed image to this disk.
    DiskReference disk = 7;
  }
  // Size and SHA-256 of the streamed image; installer only.
  uint64 image_size = 8;
  bytes image_sha256 = 9;
  // Let the installer overwrite a target disk that carries data other than chalkos partitions.
  bool wipe_disk = 10;
  // The role image's repart definitions of the system region (slot B, STATE) by file name;
  // installer only. Each role chooses its partition sizes, so the installer's own may not fit.
  map<string, string> system_definitions = 11;
  // The node's Kubernetes share (JSON): the CAs and keys for a control-plane node, the CA
  // certificate and a kubelet client certificate for a worker. Empty for a role without
  // Kubernetes.
  bytes kubernetes_share = 12;
}

message InPlace {}

// A disk by /dev path, or by a selector whose set fields must all match.
message DiskReference {
  string path = 1;
  string model = 2;
  string serial = 3;
  string wwn = 4;
  string size = 5;
  string type = 6;
}

message ImageChunk {
  bytes data = 1;
}

message InstallResponse {}

message ApplyIdentityRequest {
  // The node's identity as the manifest renders it (JSON); empty keeps the node's identity and
  // storage, for a request that delivers only a share or a node certificate.
  string identity = 1;
  // Enrolled on encrypted volumes the identity adds; required when it adds one and the node's
  // fallback is not none.
  string fallback_secret = 2;
  // A new Kubernetes share (JSON) replacing the node's, as InstallHeader carries it; empty
  // keeps the node's share.
  bytes kubernetes_share = 3;
  // A new node certificate for the node, followed by the certificate of the node CA that issued
  // it (PEM), and its key, which chalkd serves from then on; empty keeps the node's.
  bytes node_certificate = 4;
  bytes node_key = 5;
  // The OS CAs the node trusts from now on (PEM), as InstallHeader.ca_certificate holds them;
  // empty keeps the node's. They must verify the node's certificate, the caller's and a control
  // plane's node CA. Not together with a node certificate.
  bytes trust = 6;
}

message ApplyIdentityResponse {
  // Storage changes that were applied.
  repeated StorageChange changes = 1;
  // Units restarted because identity keys they read changed.
  repeated string restarted_units = 2;
}

message StorageChange {
  string volume = 1;
  string reason = 2;
  bool destructive = 3;
}

message ResetVolumeRequest {
  string volume = 1;
  // The node's identity as the manifest renders it (JSON); the volume is created as it defines.
  string identity = 2;
  string fallback_secret = 3;
}

message ResetVolumeResponse {}

message StatusRequest {}

message StatusResponse {
  // SHA-256 of the identity document the node runs, in lower-case hex.
  string identity_version = 1;
  repeated DiskStatus disks = 2;
  repeated VolumeStatus volumes = 3;
  repeated string failed_units = 4;
  // Absent on a node of a role without Kubernetes.
  KubernetesStatus kubernetes = 5;
  // Every certificate the node holds or issues, with its expiry and what needs doing about it.
  repeated CertificateStatus certificates = 6;
  // How the node keeps its clock.
  TimeStatus time = 7;
  // What the node trusts and issues with, by fingerprint.
  repeated TrustStatus trust = 8;
  // The image the node booted, and what upgrades installed beside it.
  BootStatus boot = 9;
}

message BootStatus {
  // The version of the image the node runs, and the file of the UKI it booted.
  string version = 1;
  string entry = 2;
  // Whether the boot was found healthy and marked good, or not counted by the boot loader at
  // all; false while the boot loader counts the boot's tries.
  bool blessed = 3;
  // The version an upgrade installed to boot next; empty without one.
  string staged = 4;
  // The version whose boots used up their tries without being found healthy, from which the node
  // fell back; empty without one. The failed UKI stays until the next upgrade.
  string failed = 5;
  // The last lines chalkd and the health check logged during the failed version's last boot, as
  // the check recorded them on VAR; empty without that record.
  repeated string journal = 6;
  // Why the boot could not be read; empty when it was.
  string error = 7;
}

message TrustStatus {
  // What is trusted: "OS CA" on every node; "Kubernetes CA" on nodes with Kubernetes; on
  // control-plane nodes also "front-proxy CA", "etcd CA", "service-account keys" and "encryption
  // keys".
  string name = 1;
  // The SHA-256 fingerprints of what is trusted, in lower-case hex: of certificates and of public
  // keys in DER, and of encryption keys hashed apart from both. The one that issues or signs
  // comes first.
  repeated string fingerprints = 2;
  // The fingerprint of the value the node issues, signs or encrypts with; empty where it does
  // none of these.
  string issuing = 3;
}

message CertificateStatus {
  // What the certificate is: "node", "OS CA", "node CA", "Kubernetes CA", "front-proxy CA",
  // "etcd CA", "Kubernetes control plane" (the control plane's leaf certificates, by the one
  // that expires first), "kubelet client" or "kubelet serving"; "Kubernetes share" when the
  // node's share cannot be read, so the certificates it holds are unknown.
  string name = 1;
  // Unset when the expiry is unknown.
  google.protobuf.Timestamp not_after = 2;
  // Why a renewal fails, such as "renewal failing: <reason>; expires <date>", or a warning, such
  // as "less than a third of its lifetime remains" or "node CA expires <date>; run chalkctl
  // node-ca rotate"; empty when there is nothing to do. <node> stands for the node's name.
  string problem = 3;
  // The SHA-256 fingerprint of the certificate, and of the certificate that issued it when the
  // node holds that one, in lower-case hex.
  string fingerprint = 4;
  string issuer = 5;
}

message TimeStatus {
  // Whether chrony synchronises the clock with a server.
  bool synchronised = 1;
  // The server the clock follows.
  string source = 2;
  // How far the clock is from the server's time, in seconds; positive when it is ahead.
  double offset_seconds = 3;
  // Why chrony's state could not be read; empty when it was.
  string error = 4;
}

message KubernetesStatus {
  // controlplane or worker.
  string kind = 1;
  // What the node waits for or is: "no share", "preparing" while its Kubernetes files are
  // prepared, or why their preparation failed, such as "preparation failed: no ipv4 node address
  // matches validSubnets 10.0.0.0/8 (the node has ...)"; then on a control-plane node "waiting
  // for bootstrap or for the cluster at <endpoint>", what joining that cluster does or waits for,
  // such as "joining the cluster at <endpoint>: etcd member <id> catches up" or a stale member
  // and how to remove it, "bootstrapped" or "etcd data missing: restore etcd or reinstall the
  // node"; "joined" on a worker, followed by ": the Node has no <family> pod range; ..." when the
  // control plane allocated it no pod range of one of the worker's families.
  string state = 2;
  // The status of the Node's Ready condition (True, False or Unknown), or why it could not be
  // read.
  string node_ready = 3;
  // On a bootstrapped control-plane node of a cluster with VIPs: "holder" while the node holds
  // them, "standby" otherwise. Empty on other nodes.
  string vip = 4;
  // On a bootstrapped control-plane node: "current" once its API server and etcd serve the
  // certificates the node holds now and the API server answers ready, otherwise what is not so,
  // such as "the API server serves certificates the node replaced". Empty on other nodes.
  string control_plane = 5;
}

message DiskStatus {
  string name = 1;
  string device = 2;
  // Why the disk's volumes could not be created or opened at boot; empty when they were.
  string error = 3;
}

message VolumeStatus {
  string name = 1;
  string disk = 2;
  string mount_point = 3;
  // Whether the volume's partition exists.
  bool present = 4;
  // Whether the volume is mounted at its mount point.
  bool mounted = 5;
}

message LogsRequest {
  // Unit whose journal to stream; empty streams the whole boot.
  string unit = 1;
  // Keep streaming new entries until the client cancels.
  bool follow = 2;
}

message LogsResponse {
  string line = 1;
}

message RebootRequest {}

message RebootResponse {}

message BootstrapRequest {}

message BootstrapResponse {
  // Objects applied from the cluster's manifests.
  uint32 applied = 1;
}

message EtcdMember {
  uint64 id = 1;
  // The node's name; empty while a member that was added has not started.
  string name = 2;
  repeated string peer_urls = 3;
  bool learner = 4;
  // Why the member did not answer; empty when it is healthy.
  string unhealthy = 5;
}

message EtcdMembersRequest {}

message EtcdMembersResponse {
  repeated EtcdMember members = 1;
}

message EtcdRemoveMemberRequest {
  // The member's name or its ID in hex.
  string member = 1;
  // Remove the member even when the voters left would have no healthy quorum.
  bool force = 2;
}

message EtcdRemoveMemberResponse {
  EtcdMember removed = 1;
}

message EtcdLeaveRequest {
  // Leave through the other members also when the node's own etcd member does not answer, as on
  // a node that lost its pinned address.
  bool force = 1;
}

message EtcdLeaveResponse {}

message RenewNodeCertificateRequest {
  // PKCS #10 certificate request (DER) signed with the node's new key, which never leaves the
  // node. Only its key is used; the names come from the caller's certificate.
  bytes certificate_request = 1;
}

message RenewNodeCertificateResponse {
  // The new node certificate followed by the certificate of the node CA that issued it (PEM).
  bytes certificate_chain = 1;
}

enum RotationStep {
  ROTATION_STEP_UNSPECIFIED = 0;
  // On a bootstrapped control-plane node: restart the Deployments, DaemonSets and StatefulSets of
  // the cluster's manifests, chalkos's addons among them, once the kube-root-ca.crt ConfigMaps of
  // their namespaces hold every Kubernetes CA the node trusts, and wait until they rolled out.
  ROTATION_STEP_RESTART_ADDONS = 1;
  // On a bootstrapped control-plane node: list the Secrets of type
  // kubernetes.io/service-account-token, whose tokens nothing signs again.
  ROTATION_STEP_LIST_TOKEN_SECRETS = 2;
  // On a bootstrapped control-plane node: update every object of the resources the API server
  // encrypts without changing it, so the API server encrypts it with its first key, then count
  // the objects etcd holds under each key.
  ROTATION_STEP_REWRITE_ENCRYPTED = 3;
  // On a bootstrapped control-plane node: count the objects etcd holds under each key.
  ROTATION_STEP_COUNT_ENCRYPTED = 4;
  // On a node with Kubernetes: remove the kubelet's serving certificate and restart the kubelet,
  // which requests a new one.
  ROTATION_STEP_RENEW_KUBELET_SERVING = 5;
}

message RotationStepRequest {
  RotationStep step = 1;
}

message RotationStepResponse {
  // The workloads restarted, as namespace/kind/name.
  repeated string restarted = 1;
  // The Secrets of type kubernetes.io/service-account-token, as namespace/name.
  repeated string token_secrets = 2;
  // How many objects were updated.
  uint64 rewritten = 3;
  // The objects etcd holds by resource and key.
  repeated EncryptedObjects encrypted = 4;
  // The workloads restarted but not waited for, as namespace/kind/name: their rollout does not
  // complete by itself (an OnDelete update strategy, a StatefulSet's partition, a paused
  // Deployment).
  repeated string not_waited = 5;
}

message EncryptedObjects {
  // The resource, such as secrets.
  string resource = 1;
  // The name of the key the objects are encrypted with; empty for objects stored unencrypted.
  string key = 2;
  uint64 objects = 3;
}

message UpgradeRequest {
  oneof message {
    UpgradeHeader header = 1;
    ImageChunk chunk = 2;
  }
}

message UpgradeHeader {
  // The image's version, ID, cluster and role, as its os-release names them. The node refuses
  // another ID, cluster or role than its own.
  string version = 1;
  string image_id = 2;
  string cluster = 3;
  string role = 4;
  // The verity root hash of the image's store.
  bytes root_hash = 5;
  // Sizes and SHA-256 sums of the store data the root hash covers, its hash tree and the signed
  // UKI, which follow in this order.
  uint64 store_size = 6;
  bytes store_sha256 = 7;
  uint64 verity_size = 8;
  bytes verity_sha256 = 9;
  uint64 uki_size = 10;
  bytes uki_sha256 = 11;
  // Reboot the node into the image once it is installed.
  bool reboot = 12;
}

message UpgradeResponse {
  // The node runs the image already; nothing changed.
  bool already_installed = 1;
  // The file name of the UKI that boots the image next, with its tries.
  string entry = 2;
  // The node reboots into the image.
  bool rebooting = 3;
}
