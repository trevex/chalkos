syntax = "proto3";

// The API of chalkd, the agent on every chalkos node and on the installer. chalkd serves it on
// TCP port 50000 over TLS; chalkctl is its client.
package chalkos.node.v1;

option go_package = "github.com/trevex/chalkos/pkg/api/node/v1;nodev1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";

// NodeService is the API chalkd serves on each node. Each method's comment names the modes it is
// available in, maintenance mode, normal mode or both, and the least role a client certificate
// needs to call it: reader, operator or admin, where each role may call what the roles before it
// may. The API of each layer the image carries, such as chalkos.kubernetes.v1.KubernetesService,
// is served beside it.
service NodeService {
  // Info describes the node and the agent. Available in maintenance and normal mode to readers.
  rpc Info(InfoRequest) returns (InfoResponse);
  // Disks lists the node's disks and their partitions. Available in maintenance and normal mode to
  // readers.
  rpc Disks(DisksRequest) returns (DisksResponse);
  // Contract returns the config contract of the image the node runs: the variant and platform it
  // was built for, its layers, the schemas of the config kinds it accepts and its layers' facts,
  // such as the Kubernetes image.json, which chalkctl checks config against before it delivers
  // it. The installer refuses it: config is for the image it installs, whose contract comes with
  // that image. Available in maintenance and normal mode to readers.
  rpc Contract(ContractRequest) returns (ContractResponse);
  // Install turns a node in maintenance mode into an installed node and reboots it. The first
  // message carries the header; when the node is the installer, the image's store data, hash
  // tree, UKI and boot loader follow as chunks, unless the header's source names an image in a
  // registry, which the installer pulls. An install the installer did not finish continues when
  // run again, from either. Available in maintenance mode to admins.
  rpc Install(stream InstallRequest) returns (InstallResponse);
  // ApplyConfig replaces the config of an installed node, or delivers it payloads of its layers,
  // such as a Kubernetes share, a node certificate or OS CAs. Destructive storage changes are
  // refused; additive ones are applied live. With try, the config is on trial: the node rolls it
  // back by itself, as RollbackConfig does, unless ConfirmConfig confirms it in time. While a
  // config is on trial, the node refuses every ApplyConfig, an Upgrade and a RollbackImage with
  // FAILED_PRECONDITION. Available in normal mode to admins.
  rpc ApplyConfig(ApplyConfigRequest) returns (ApplyConfigResponse);
  // GetConfig returns the config a slot keeps, the running image's, its previous one or the staged
  // image's, as it was delivered, with secret values replaced by their hashes. Available in normal
  // mode to admins.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  // ResetVolume wipes one volume and creates it again as the delivered config defines it. It
  // refuses VAR, a volume the config no longer has and a volume the config moves to another
  // disk. Available in normal mode to admins.
  rpc ResetVolume(ResetVolumeRequest) returns (ResetVolumeResponse);
  // Status reports the state of an installed node: its config versions, storage, failed units,
  // certificates, trust, clock, boot and outputs; each layer's own state is its service's Status.
  // Available in normal mode to readers.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Logs streams the journal of the current boot, or of one unit in it. Available in maintenance
  // and normal mode to readers.
  rpc Logs(LogsRequest) returns (stream LogsResponse);
  // Reboot reboots the node once the response is sent. Available in maintenance and normal mode
  // to operators.
  rpc Reboot(RebootRequest) returns (RebootResponse);
  // Upgrade installs a new image into the node's inactive slot, from which it boots next, counting
  // the image's boot tries until a boot is found healthy, and reboots the node when asked to.
  // The first message carries the header; the store, its hash tree and the UKI follow as chunks,
  // unless the header's source names an image in a registry, which the node pulls. Available in
  // normal mode to operators. Delivering config or a fallback secret with the upgrade needs the
  // admin role, as ApplyConfig does; without them the node carries the running image's config
  // over. The node checks that the image is of its platform, and, once the store is written and
  // before the image becomes the next boot, that the schemas in the image accept the config it
  // keeps for the image. It does not check that the image is one to trust: without Secure Boot,
  // an operator can run any image as root, with STATE and VAR unsealed, as their keys are sealed
  // to PCR 7 alone. Secure Boot is what limits upgrades to images signed for db.
  rpc Upgrade(stream UpgradeRequest) returns (UpgradeResponse);
  // Diagnostics lists the diagnostics the image declares: read-only commands of the image, such as
  // ip route get, that RunDiagnostic runs. Available in maintenance and normal mode to readers.
  rpc Diagnostics(DiagnosticsRequest) returns (DiagnosticsResponse);
  // RunDiagnostic runs one of the image's diagnostics with the arguments given and streams what
  // its command prints on standard output and standard error, then how it ended. It is refused
  // with PERMISSION_DENIED unless the caller also has the diagnostic's own role, and with
  // INVALID_ARGUMENT unless each argument is of its parameter's type and every parameter without
  // a default or optional is given. chalkd runs the command as a transient systemd unit under a
  // user of its own, on a read-only file system, with no capabilities but those the diagnostic
  // names, for at most its timeout, and stops a command that prints more than 1 MiB. Four run at
  // a time. Available in maintenance and normal mode to readers.
  rpc RunDiagnostic(RunDiagnosticRequest) returns (stream RunDiagnosticResponse);
  // RollbackConfig delivers the running image's previous config again: the config the image ran
  // before the delivery that replaced it, which the node keeps until the next delivery replaces
  // it in turn. It goes through ApplyConfig's checks and steps: the image's change rules compared
  // with the config the node runs and the machine, storage changes, outputs and effects, so a
  // refusal names the rule. The config it replaces becomes the previous one, so a second rollback
  // undoes the first. Only the config documents return: the OS CAs, the node certificate and the
  // layers' payloads stay as they are. An upgrade's image starts without a previous config.
  // During a trial it rolls the config on trial back at once and ends the trial. Available in
  // normal mode to admins.
  rpc RollbackConfig(RollbackConfigRequest) returns (RollbackConfigResponse);
  // RollbackImage makes the previous image boot next again: the image an upgrade replaced, whose
  // store the inactive slot still holds, whose UKI is on the ESP and whose config slot STATE
  // keeps, until the next upgrade writes the slot. The node writes no store: it checks the image's
  // UKI as an upgrade checks a new one and renames it to the next generation with the tries it
  // asks for, so boot counting falls back to the running image should its boots fail. While the
  // running image's boot has not been found healthy, the name carries no tries instead: the image
  // stays the node's known-good entry. The image boots with the config it last ran. The node
  // reboots into it when asked to. Refused with FAILED_PRECONDITION when the node keeps no
  // previous image, as while an upgrade's image is staged. Available in normal mode to operators.
  rpc RollbackImage(RollbackImageRequest) returns (RollbackImageResponse);
  // ConfirmConfig ends the trial of a config that ApplyConfig delivered with try, and the node keeps
  // the config from then on. The node must be healthy as the health check of a boot finds it:
  // chalkd serves, no unit of the boot failed but those the image ignores, and the image's layers
  // find their services healthy. It answers UNAVAILABLE while the node is not, so a client asks
  // again. It answers FAILED_PRECONDITION when no trial of the version is open, unless the node
  // runs that version, so a request sent twice confirms once. Available in normal mode to admins.
  rpc ConfirmConfig(ConfirmConfigRequest) returns (ConfirmConfigResponse);
}

// The mode chalkd serves the node in.
enum Mode {
  // No mode; chalkd never reports it.
  MODE_UNSPECIFIED = 0;
  // The node is not installed: chalkd serves a self-signed certificate.
  MODE_MAINTENANCE = 1;
  // The node is installed: chalkd serves its node certificate and requires client certificates.
  MODE_NORMAL = 2;
}

// The state of Secure Boot, as the firmware's EFI variables SecureBoot and SetupMode give it.
enum SecureBoot {
  // No state; chalkd never reports it.
  SECURE_BOOT_UNSPECIFIED = 0;
  // Secure Boot is off, or its EFI variables cannot be read.
  SECURE_BOOT_DISABLED = 1;
  // Secure Boot is on: the firmware starts only binaries that db allows.
  SECURE_BOOT_ENABLED = 2;
  // The firmware accepts new Secure Boot keys without authentication.
  SECURE_BOOT_SETUP_MODE = 3;
}

// The request of Info.
message InfoRequest {}

// The response of Info.
message InfoResponse {
  // Mode chalkd serves the node in.
  Mode mode = 1;
  // Image ID of the running image, such as "chalkos".
  string image_id = 2;
  // Whether the node runs the installer, which writes a node's image to another disk.
  bool installer = 3;
  // Device of the disk the node booted from; empty on the installer booted from a CD.
  string boot_disk = 4;
  // Whether the kernel found a TPM, as /sys/class/tpm lists one.
  bool tpm = 5;
  // State of Secure Boot.
  SecureBoot secure_boot = 6;
  // SHA-256 of the certificate chalkd serves, in lower-case hex.
  string fingerprint = 7;
  // Host name of the node, as the kernel holds it.
  string hostname = 8;
  // The mkImages variant the running image was built as; empty on the installer.
  string variant = 9;
  // The platform the running image was built for, such as metal or kvm; empty on the installer,
  // which installs images of every platform.
  string platform = 10;
  // The verity root hash of the store the node runs, as its kernel command line's usrhash= names
  // it, which identifies the running image; empty when it could not be read.
  bytes root_hash = 11;
  // The git revision the running image was built from, as the node's record of the images it
  // installed names it; empty when it does not know it.
  string revision = 12;
  // The git tag the running image was built from, as the node's record of the images it
  // installed names it; empty when it does not know it.
  string tag = 13;
  // The layers the running image carries beside the base every image has, such as "kubernetes",
  // in name order; empty on the installer and on an image of the base alone.
  repeated string layers = 14;
}

// The request of Disks.
message DisksRequest {}

// The response of Disks.
message DisksResponse {
  // The node's disks, by kernel name.
  repeated Disk disks = 1;
}

// A disk of the node, as sysfs and the udev database describe it.
message Disk {
  // Kernel name, such as nvme0n1.
  string name = 1;
  // Device node, such as /dev/nvme0n1.
  string device = 2;
  // Model, from udev's ID_MODEL with spaces for underscores, or else from sysfs.
  string model = 3;
  // Size in bytes.
  uint64 size = 4;
  // Serial number, from udev's ID_SERIAL_SHORT, or else ID_SERIAL.
  string serial = 5;
  // World Wide Name, from udev's ID_WWN; empty for a disk without one.
  string wwn = 6;
  // Kind of disk: nvme, ssd or hdd.
  string type = 7;
  // Path of the disk's connection, from udev's ID_PATH.
  string path = 8;
  // The disk's partitions, by number.
  repeated Partition partitions = 9;
  // How chalkos uses the disk: "boot" for the boot disk, "disk <name>" for a pinned disk of the
  // node's storage, empty when chalkos does not use it.
  string usage = 10;
}

// A partition of a disk, as sysfs and the udev database describe it.
message Partition {
  // Device node, such as /dev/nvme0n1p3.
  string device = 1;
  // Partition number.
  uint32 number = 2;
  // Size in bytes.
  uint64 size = 3;
  // GPT partition type UUID, in lower case.
  string type = 4;
  // GPT partition name.
  string label = 5;
  // GPT partition UUID, in lower case.
  string uuid = 6;
  // File system or other content blkid found, such as ext4 or crypto_LUKS.
  string content = 7;
}

// The request of Contract.
message ContractRequest {}

// The response of Contract: the config contract of the image the node runs.
message ContractResponse {
  // The image's schemas by file name, as /etc/chalkos/schemas holds them.
  map<string, bytes> schemas = 1;
  // The variant the image was built as, as its os-release names it.
  string variant = 2;
  // The platform the image was built for, as its os-release names it.
  string platform = 3;
  // The facts of the image's layers, such as chalkos.kubernetes.v1.ImageFacts, which config is
  // translated with; empty for an image whose layers have none.
  repeated google.protobuf.Any layer_facts = 4;
  // The layers the image carries beside the base every image has, such as "kubernetes", in name
  // order.
  repeated string layers = 5;
}

// A message of the Install stream: the header first, then the image's chunks.
message InstallRequest {
  oneof message {
    // The install's header, in the stream's first message.
    InstallHeader header = 1;
    // The next bytes of the image's parts, in every message after the first.
    ImageChunk chunk = 2;
  }
}

// What an install delivers: the node's credentials and config, the target and the image.
message InstallHeader {
  // PEM certificate chalkd serves once the node is installed.
  bytes node_certificate = 1;
  // PEM key of node_certificate.
  bytes node_key = 2;
  // PEM certificates of the OS CAs the node trusts, the one that issues client certificates and
  // the node CA first, then those still trusted while it rotates.
  bytes ca_certificate = 3;
  // Recovery key or password enrolled as the second keyslot of every encrypted volume; empty
  // when the node's fallback is none.
  string fallback_secret = 4;
  oneof target {
    // Target of a node whose image already runs from its boot disk.
    InPlace in_place = 5;
    // Target disk, which the installer lays out and writes the streamed image to.
    DiskReference disk = 6;
  }
  // The image the installer writes to the target disk; it must name the boot loader. Installer
  // only.
  ImageHeader image = 7;
  // Whether the installer may replace what the target disk holds, including an installed node.
  bool wipe_disk = 8;
  // The node's config: YAML documents separated by ---. chalkd checks them as a set against the
  // schemas of the image it installs, fills in their defaults, keeps them on STATE and translates
  // them into what the node applies at boot. Required.
  string config = 9;
  // Where the installer takes the contract and the parts of the image it writes from.
  oneof origin {
    // The contract of an image whose parts follow the header as chunks. Installer only: in place,
    // chalkd checks the config against the running image.
    ImageContract contract = 10;
    // An image in a registry, which the installer pulls. Its contract layer holds the image's
    // contract, and the request carries nothing after the header. Installer only.
    ImageSource source = 11;
  }
  // Payloads of the installed image's layers, such as chalkos.kubernetes.v1.Share, which the
  // node keeps on STATE. The node refuses a payload no layer takes.
  repeated google.protobuf.Any layers = 12;
}

// The contract of the image an installer writes, as its image directory holds it.
message ImageContract {
  // The image's repart definitions of the system region (ESP, slots A and B, STATE) by file
  // name, which the installer lays out the target disk with. Each image chooses its partition
  // sizes, so the installer's own may not fit.
  map<string, string> system_definitions = 1;
  // The image's schemas by file name, as its image directory's schemas/ holds them; the config is
  // checked against them.
  map<string, bytes> schemas = 2;
  // The facts of the image's layers, such as chalkos.kubernetes.v1.ImageFacts; empty for an image
  // whose layers have none.
  repeated google.protobuf.Any layer_facts = 3;
}

// The target of an install in place, which the node's own image runs from its boot disk.
message InPlace {}

// A disk by /dev path, or by a selector whose set fields must all match.
message DiskReference {
  // Path of the disk below /dev, such as /dev/disk/by-id/…; set without the selector fields.
  string path = 1;
  // Glob the disk's model matches, such as "Samsung SSD 870*".
  string model = 2;
  // The disk's serial number.
  string serial = 3;
  // The disk's World Wide Name.
  string wwn = 4;
  // Comparison the disk's size meets, such as ">= 1T"; without an operator, the size it equals.
  string size = 5;
  // Kind of disk: nvme, ssd or hdd.
  string type = 6;
}

// An image as install and upgrade send it. Its parts follow the header as chunks, in this order:
// the store data, the hash tree, the UKI and, when the header names one, the boot loader, unless
// the request's source names where the node pulls them from.
message ImageHeader {
  // The image's ID, as its os-release names it.
  string image_id = 1;
  // The verity root hash of the image's store.
  bytes root_hash = 2;
  // The store data, which the root hash covers.
  ImagePart store = 3;
  // The store's verity hash tree.
  ImagePart hash_tree = 4;
  // The signed UKI that boots the image.
  ImagePart uki = 5;
  // The signed systemd-boot, which firmware starts from the ESP's removable-media path.
  ImagePart boot_loader = 6;
  // The architecture the image runs on, as systemd and os-release name it: x86-64 or arm64. A
  // node refuses an image of another architecture than its own.
  string architecture = 7;
  // The platform the image is built for, as its os-release names it, such as metal or kvm. A node
  // refuses an upgrade to an image of another platform than its own, and the installer
  // translates the config for the platform the image names.
  string platform = 8;
  // The git revision the image was built from, as its directory's metadata.json names it; empty
  // when the build named none. The node records it to show beside the image's root hash; nothing
  // compares it.
  string revision = 9;
  // The git tag the image was built from, as its directory's metadata.json names it; empty when
  // the build named none. The node records it as it does revision.
  string tag = 10;
}

// The size and SHA-256 of a part of an image.
message ImagePart {
  // Size in bytes.
  uint64 size = 1;
  // SHA-256 of the part's bytes.
  bytes sha256 = 2;
}

// Where a node takes an image's parts from when they do not follow the header as chunks.
message ImageSource {
  oneof source {
    // A chalkos image in an OCI registry, which the node pulls.
    RegistryImage oci = 1;
  }
}

// A chalkos image in an OCI registry.
message RegistryImage {
  // The image's repository and manifest digest, repository@sha256:…, as chalkctl resolved the
  // inventory's reference. The node pulls that manifest and refuses it unless its config is the
  // image the header describes and its store, hash-tree, UKI and, for an install, boot-loader
  // layers have the header's sizes and SHA-256 sums. An upgrade pulls through the Mirror and
  // authenticates with the Registry documents of the config the request delivers, or without one
  // of the running config; an install through those of the config the request delivers. It tries
  // each endpoint of the Mirror of the reference's host, then the host, each with the Registry of
  // its own host, and pulls anonymously from a host without one.
  string reference = 1;
}

// A piece of an image's parts, which follow the header back to back in the header's order.
message ImageChunk {
  // The next bytes of the parts; a chunk may end inside a part or span two. chalkctl sends 1 MiB
  // per chunk.
  bytes data = 1;
}

// The response of Install, which the node sends before it reboots.
message InstallResponse {}

// The request of ApplyConfig: a config, or layer payloads, a node certificate or OS CAs to deliver.
message ApplyConfigRequest {
  // Recovery key or password enrolled on the encrypted volumes the config adds; required when it
  // adds one and the node's fallback is not none.
  string fallback_secret = 1;
  // A new node certificate for the node, followed by the certificate of the node CA that issued
  // it (PEM), which chalkd serves from then on; empty keeps the node's.
  bytes node_certificate = 2;
  // PEM key of node_certificate; empty keeps the node's.
  bytes node_key = 3;
  // The OS CAs the node trusts from now on (PEM), as InstallHeader.ca_certificate holds them;
  // empty keeps the node's. They must verify the node's certificate, the caller's and a control
  // plane's node CA. Not together with a node certificate.
  bytes trust = 4;
  // The node's config, as InstallHeader.config holds it, checked against the running image's
  // schemas. It replaces the node's config as a whole. Empty keeps the node's config and
  // storage, for a request that delivers only layer payloads, a node certificate or OS CAs.
  string config = 5;
  // Whether the config is for the image staged to boot next: chalkd checks it against that image
  // and keeps it in that image's config slot, changing nothing the running image runs but the
  // machine's storage. The config meets that image's change rules, compared with the running
  // slot's config and the machine as for the running image, and the storage changes they accept
  // are made at once, with fallback_secret. It takes the config and the fallback secret alone,
  // and an image staged.
  bool staged = 6;
  // Payloads of the image's layers, such as a new chalkos.kubernetes.v1.Share replacing the
  // node's, each kept by the layer whose type it is; the node refuses a payload no layer of its
  // image takes. Empty keeps the layers' payloads.
  repeated google.protobuf.Any layers = 7;
  // How long the config is on trial: the node rolls it back by itself, as RollbackConfig does,
  // unless ConfirmConfig confirms it within the duration, and a boot before that restores the
  // config from before it. A trial takes config for the running image alone, without staged,
  // layer payloads, a node certificate or OS CAs, and lasts at most 24 hours. The node refuses it
  // with FAILED_PRECONDITION for a config that changes the node's storage, which a rollback cannot
  // undo, for the config it runs already and on a node without config. Unset applies the config
  // for good.
  google.protobuf.Duration try = 8;
  // With try, systemd units the health check that ConfirmConfig waits for leaves out, besides those
  // the image ignores, such as demo.service: a unit that failed before the trial and is not the
  // trial's concern. Each must be a unit name. The node keeps them with the trial.
  repeated string ignore_units = 9;
}

// The request of GetConfig.
message GetConfigRequest {
  // Whether the response holds the staged image's config instead of the running one's.
  bool staged = 1;
  // Whether the response holds the running image's previous config, which RollbackConfig delivers
  // again, instead of the one it runs. Not together with staged.
  bool previous = 2;
}

// The response of GetConfig: the config one slot keeps.
message GetConfigResponse {
  // The slot's documents as delivered, one JSON document each separated by ---, as
  // ApplyConfigRequest.config holds them. The values of Secrets and of the Kubernetes Secrets an
  // Addon applies are replaced by the lower-case hex SHA-256 of the value, as config_version
  // hashes a Secret's.
  string documents = 1;
  // The slot's version, as StatusResponse.config_version gives it.
  string version = 2;
}

// The response of ApplyConfig: what the delivery changed on the node.
message ApplyConfigResponse {
  // Storage changes that were applied.
  repeated StorageChange changes = 1;
  // Units the delivery restarted, as the image's effects say.
  repeated string restarted_units = 2;
  // Why the rule of an effect could not be evaluated, without the values it read; the delivery
  // took the effect all the same.
  repeated string warnings = 3;
}

// A change a delivery made to the node's storage.
message StorageChange {
  // Name of the volume that changed.
  string volume = 1;
  // What changed, such as "new volume", "new volume on new disk <disk>", "larger: 200G instead of
  // 100G" or "mounted at /data instead of null".
  string reason = 2;
}

// The request of ResetVolume.
message ResetVolumeRequest {
  // Name of the volume to reset.
  string volume = 1;
  // Recovery key or password enrolled on the volume when it is encrypted; required then, unless
  // the node's fallback is none.
  string fallback_secret = 2;
  // The node's config, as ApplyConfigRequest.config holds it, checked against the running
  // image's schemas; the volume is created as it defines. Required.
  string config = 3;
}

// The response of ResetVolume, once the volume is created again.
message ResetVolumeResponse {}

// The request of RollbackConfig.
message RollbackConfigRequest {
  // The version of the previous config to deliver again, as
  // StatusResponse.previous_config_version gives it. The node refuses another with
  // FAILED_PRECONDITION, so a request sent twice rolls back once. Required.
  string version = 1;
}

// The response of RollbackConfig: what delivering the previous config changed, as
// ApplyConfigResponse says it.
message RollbackConfigResponse {
  // Storage changes that were applied.
  repeated StorageChange changes = 1;
  // Units the delivery restarted, as the image's effects say.
  repeated string restarted_units = 2;
  // Why the rule of an effect could not be evaluated, without the values it read; the delivery
  // took the effect all the same.
  repeated string warnings = 3;
}

// The request of RollbackImage.
message RollbackImageRequest {
  // The verity root hash of the previous image's store, as BootStatus.previous gives it. The node
  // refuses another, and answers already_installed while it runs the image and already_staged
  // while the image boots next, so a request sent twice rolls back once. Required.
  bytes root_hash = 1;
  // Whether the node reboots into the image once it boots next.
  bool reboot = 2;
}

// The response of RollbackImage.
message RollbackImageResponse {
  // Whether the node runs the image already, so nothing changed.
  bool already_installed = 1;
  // The file name of the UKI that boots the image next, with its tries while it has them.
  string entry = 2;
  // Whether the node reboots into the image.
  bool rebooting = 3;
  // Whether the image boots next already, from entry, as a rollback without a reboot left it.
  bool already_staged = 4;
}

// The request of ConfirmConfig.
message ConfirmConfigRequest {
  // The version of the config on trial, as ConfigTrial.version gives it. Required.
  string version = 1;
}

// The response of ConfirmConfig, once the trial ended.
message ConfirmConfigResponse {}

// The request of Status.
message StatusRequest {}

// The response of Status: the state of an installed node.
message StatusResponse {
  // The disks of the node's storage, by name, as the boot's storage setup left them.
  repeated DiskStatus disks = 1;
  // The volumes of the node's storage, by name.
  repeated VolumeStatus volumes = 2;
  // Names of the systemd units that failed.
  repeated string failed_units = 3;
  // Every certificate the node holds or issues, with its expiry and what needs doing about it.
  repeated CertificateStatus certificates = 4;
  // How the node keeps its clock.
  TimeStatus time = 5;
  // What the node trusts and issues with, by fingerprint.
  repeated TrustStatus trust = 6;
  // The image the node booted, and what upgrades installed beside it.
  BootStatus boot = 7;
  // The platform the running image was built for.
  string platform = 8;
  // SHA-256 of the config the node runs, as it was delivered, in lower-case hex: of its documents
  // in canonical JSON, ordered by apiVersion, kind and name, with each Secret value replaced by
  // its own SHA-256. Empty on a node that runs no config.
  string config_version = 9;
  // The version of the config kept for the image staged to boot next, as config_version gives
  // the running one's; empty without a staged image or config for it.
  string staged_config_version = 10;
  // The image's outputs, by name.
  repeated OutputStatus outputs = 11;
  // The version of the running image's previous config, which RollbackConfig delivers again, as
  // config_version gives the running one's; empty while the node keeps none, as after an install
  // or an upgrade.
  string previous_config_version = 12;
  // The config on trial, while one is; unset otherwise.
  ConfigTrial trial = 13;
}

// A config on trial, which the node rolls back by itself at the deadline unless ConfirmConfig
// confirms it first.
message ConfigTrial {
  // The version of the config on trial, as StatusResponse.config_version gives it.
  string version = 1;
  // The version of the config the node ran before, which the rollback delivers again.
  string previous_version = 2;
  // When the node rolls the config back, unless it is confirmed first.
  google.protobuf.Timestamp deadline = 3;
  // Why the rollback at the deadline failed, which the node tries again each minute; empty before
  // the deadline and while none failed.
  string error = 4;
  // The units the trial's health check leaves out besides those the image ignores, as
  // ApplyConfigRequest.ignore_units named them.
  repeated string ignore_units = 5;
}

// The state of one output of the running image.
message OutputStatus {
  // The output's name, as the image declares it.
  string name = 1;
  // The SHA-256 of the names and contents of the files the node serves, in lower-case hex; empty
  // while it serves none, as after a render that failed at boot.
  string hash = 2;
  // Why the output's last render or check failed, at a delivery or at boot; empty once one passed.
  // What the program wrote to standard error is in the node's journal alone.
  string error = 3;
}

// The images on the node's ESP and how the running one booted.
message BootStatus {
  // The image the node runs.
  BootImage running = 1;
  // File name of the UKI the node booted, in the ESP's /EFI/Linux, with its tries counter while
  // it has one.
  string entry = 2;
  // Whether the boot was found healthy and marked good, or not counted by the boot loader at
  // all; false while the boot loader counts the boot's tries.
  bool blessed = 3;
  // The image an upgrade installed or a rollback made to boot next; unset without one.
  BootImage staged = 4;
  // The image whose boots used up their tries without being found healthy, from which the node
  // fell back; unset without one. The failed UKI stays until the next upgrade.
  BootImage failed = 5;
  // The last lines chalkd and the health check logged during the failed image's last boot, as
  // the check recorded them on VAR; empty without that record.
  repeated string journal = 6;
  // Why the boot could not be read; empty when it was. The running image's root hash is set when
  // the kernel command line could be read.
  string error = 7;
  // The image RollbackImage boots: the one an upgrade replaced, whose UKI is on the ESP and whose
  // config slot STATE keeps; unset without one, as after an install, while another image is
  // staged, or after a fallback.
  BootImage previous = 8;
  // The image the last RollbackImage rolled back to, while the node runs it or boots it next; unset
  // otherwise, and once an upgrade replaced it. A client that rolls back several nodes to one image
  // knows by it which of them a rollback got there already.
  BootImage rollback = 9;
}

// An image a UKI on the ESP boots.
message BootImage {
  // The verity root hash of the image's store, from the usrhash= of the UKI or, for the running
  // image, of the kernel command line; it identifies the image.
  bytes root_hash = 1;
  // The generation of the UKI's boot entry, from its file name, <image ID>_<generation>.efi;
  // systemd-boot boots the highest first. Zero when the name gives none or the entry is unknown.
  uint64 generation = 2;
  // The git revision the image was built from, as the node's record of the images it installed
  // names it; empty when it does not know it.
  string revision = 3;
  // The git tag the image was built from, as the node's record of the images it installed names
  // it; empty when it does not know it.
  string tag = 4;
}

// What the node trusts of one kind, and what it issues with.
message TrustStatus {
  // What is trusted: "OS CA" on every node; a layer adds what it trusts, such as "Kubernetes
  // CA" on a node with Kubernetes.
  string name = 1;
  // The SHA-256 fingerprints of what is trusted, in lower-case hex: of certificates and of public
  // keys in DER, and of encryption keys hashed apart from both. The one that issues or signs
  // comes first.
  repeated string fingerprints = 2;
  // The fingerprint of the value the node issues, signs or encrypts with; empty where it does
  // none of these.
  string issuing = 3;
}

// A certificate the node holds or issues with.
message CertificateStatus {
  // What the certificate is: "node" and "OS CA" on every node; a layer adds its own, such as
  // "node CA" on a node that issues node certificates or "kubelet client".
  string name = 1;
  // When the certificate expires; unset when the expiry is unknown.
  google.protobuf.Timestamp not_after = 2;
  // Why a renewal fails, such as "renewal failing: <reason>; expires <date>", or a warning, such
  // as "less than a third of its lifetime remains" or "the node certificate expires on <date>;
  // this image cannot renew it on its own; run chalkctl node renew <node>"; empty when there is
  // nothing to do. A command it advises names the node, or says <node> when the node cannot tell
  // its name.
  string problem = 3;
  // The SHA-256 fingerprint of the certificate, in lower-case hex.
  string fingerprint = 4;
  // The SHA-256 fingerprint of the certificate that issued it, in lower-case hex; empty when the
  // node does not hold that one.
  string issuer = 5;
}

// How the node keeps its clock, as chrony reports it.
message TimeStatus {
  // Whether chrony synchronises the clock with a server.
  bool synchronised = 1;
  // The server the clock follows.
  string source = 2;
  // How far the clock is from the server's time, in seconds; positive when it is ahead.
  double offset_seconds = 3;
  // Why chrony's state could not be read; empty when it was.
  string error = 4;
}

// A disk of the node's storage, as the boot's storage setup left it.
message DiskStatus {
  // The disk's name in the node's storage: system for the system disk, or the name of the Volume
  // that has the disk to itself.
  string name = 1;
  // Device node the disk was found at, such as /dev/nvme0n1; empty when it was not found.
  string device = 2;
  // Why the disk's volumes could not be created or opened at boot; empty when they were.
  string error = 3;
}

// A volume of the node's storage.
message VolumeStatus {
  // The volume's name: var for VAR, or the name of its Volume document.
  string name = 1;
  // Name of the disk the volume is on, as DiskStatus.name gives it.
  string disk = 2;
  // Where the config mounts the volume; empty for a volume it leaves unmounted.
  string mount_point = 3;
  // Whether the volume's partition exists.
  bool present = 4;
  // Whether the volume is mounted at its mount point.
  bool mounted = 5;
}

// The request of Logs.
message LogsRequest {
  // Unit whose journal to stream; empty streams the whole boot.
  string unit = 1;
  // Whether the stream goes on with new entries until the client cancels it.
  bool follow = 2;
}

// A message of the Logs stream.
message LogsResponse {
  // One journal entry, as journalctl's short-iso output prints it.
  string line = 1;
}

// The request of Reboot.
message RebootRequest {}

// The response of Reboot, which the node sends before it reboots.
message RebootResponse {}

// A message of the Upgrade stream: the header first, then the image's chunks.
message UpgradeRequest {
  oneof message {
    // The upgrade's header, in the stream's first message.
    UpgradeHeader header = 1;
    // The next bytes of the image's parts, in every message after the first.
    ImageChunk chunk = 2;
  }
}

// What an upgrade delivers: the image and, optionally, the node's config for it.
message UpgradeHeader {
  // The image to install. The node refuses another ID or platform than its own, and an image that
  // names a boot loader: an upgrade leaves the boot loader as it is.
  ImageHeader image = 1;
  // Whether the node reboots into the image once it is installed.
  bool reboot = 2;
  // The node's config for the image, as ApplyConfigRequest.config holds it. The node checks it
  // against the image's schemas and change rules as ApplyConfig does: it refuses what the rules
  // refuse, such as a storage change that takes a reset or a reinstall, or a change of a fixed
  // Kubernetes setting, makes the storage changes they accept, such as a new volume, at once, and
  // keeps the config in the image's config slot. Empty carries the running image's config over,
  // checked against the image the same way. Only the admin role may set it.
  string config = 3;
  // Recovery key or password enrolled on the encrypted volumes the config adds, as
  // ApplyConfigRequest.fallback_secret is; required when it adds one and the node's fallback is
  // not none. Only the admin role may set it.
  string fallback_secret = 4;
  // Where the node takes the image's parts from. Absent, they follow the header as chunks; for
  // an image in a registry, the node pulls them and the request carries nothing after the header.
  ImageSource source = 5;
}

// The response of Upgrade.
message UpgradeResponse {
  // Whether the node runs the image already, so nothing changed.
  bool already_installed = 1;
  // The file name of the UKI that boots the image next, with its tries.
  string entry = 2;
  // Whether the node reboots into the image.
  bool rebooting = 3;
  // Whether the image boots next already, from entry, as an earlier upgrade without a reboot left
  // it; the image was not written again, and the config the upgrade carries, or the running
  // image's, replaced the config kept for it.
  bool already_staged = 4;
}

// The request of Diagnostics.
message DiagnosticsRequest {}

// The response of Diagnostics.
message DiagnosticsResponse {
  // The image's diagnostics, in name order.
  repeated Diagnostic diagnostics = 1;
}

// A diagnostic the image declares.
message Diagnostic {
  // Name RunDiagnostic takes, such as "route-get".
  string name = 1;
  // One sentence on what the diagnostic shows.
  string description = 2;
  // Its parameters: those a call must give, then the others, each in the order its command names
  // them.
  repeated DiagnosticParameter parameters = 3;
  // Least role that runs it: reader, operator or admin.
  string role = 4;
  // How long it may run before systemd stops it, such as "10s".
  string timeout = 5;
}

// A parameter of a diagnostic.
message DiagnosticParameter {
  // Name the arguments of RunDiagnostic give it by.
  string name = 1;
  // What its value is: address, prefix, hostname, interface, int, enum or pattern.
  string type = 2;
  // One sentence on the value.
  string description = 3;
  // Whether a call may leave it out.
  bool optional = 4;
  // The value it takes when a call leaves it out; empty when leaving it out drops the arguments
  // of the command that name it.
  string default_value = 5;
  // Least value of an int parameter, when it has one.
  optional int64 min = 6;
  // Greatest value of an int parameter, when it has one.
  optional int64 max = 7;
  // The values of an enum parameter.
  repeated string values = 8;
  // The RE2 regular expression a pattern parameter's value matches whole.
  string regex = 9;
}

// The request of RunDiagnostic.
message RunDiagnosticRequest {
  // Name of the diagnostic, as Diagnostics lists it.
  string name = 1;
  // The value of each parameter given, by parameter name.
  map<string, string> arguments = 2;
}

// A message of the RunDiagnostic stream: output as the command prints it, then how it ended.
message RunDiagnosticResponse {
  oneof output {
    // Bytes the command printed on standard output.
    bytes stdout = 1;
    // Bytes the command printed on standard error.
    bytes stderr = 2;
    // How the command ended; the stream's last message.
    DiagnosticExit exit = 3;
  }
}

// How a diagnostic's command ended.
message DiagnosticExit {
  // Its exit status, while stopped is empty.
  int32 code = 1;
  // Why the command ended without exiting by itself, else empty: "timeout" once it ran longer
  // than the diagnostic's timeout, "output-limit" once it printed more than 1 MiB, of which the
  // stream holds the first 1 MiB, or systemd's result of its unit, such as "signal".
  string stopped = 2;
}
