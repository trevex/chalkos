# node3: a control plane whose two ports are both on the fabric's switch. Its address sits on the
# dummy interface node0, and FRR announces it over a session on each port, so the address stays
# reachable while one port or cable works.
#
# The ports' Network documents and the BGPPeers lie in bgp/fabric.yaml, under the names fabric-a
# and fabric-b, which the Link documents below give the ports.
#
# The node's two fabric ports by MAC, so BGP follows the same cables whatever names the kernel
# gives them. These are the VM's MACs; on real hardware put the ports' MACs, which the
# addresses diagnostic shows.
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Link
metadata: {name: 10-fabric-a}
spec:
  match: {permanentMACAddress: "02:00:00:00:13:01"}
  link: {name: fabric-a}
---
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Link
metadata: {name: 10-fabric-b}
spec:
  match: {permanentMACAddress: "02:00:00:00:13:02"}
  link: {name: fabric-b}
---
# The system disk by its serial, which vm/vm.sh gives the VM's disk. On real hardware put the
# SSD's serial, which chalkctl disks shows.
apiVersion: storage.chalkos.dev/v1alpha1
kind: SystemDisk
metadata: {name: system}
spec:
  disk: {serial: chalkos-node3}
---
# node0 holds the node's address, and the API's VIP while the node holds it. chalkd adds the VIP
# with a preferred lifetime of 0, which networkd counts as a dynamic address, so keepConfiguration
# yes has networkd keep every address it did not configure itself when it configures the link again.
apiVersion: networkd.chalkos.dev/v1alpha1
kind: NetDev
metadata: {name: 30-node0}
spec:
  netDev: {name: node0, kind: dummy}
---
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Network
metadata: {name: 30-node0}
spec:
  match: {name: node0}
  network: {address: ["fdc8:a1b2:c3d4:ff::13/128"], keepConfiguration: "yes"}
---
apiVersion: kubernetes.chalkos.dev/v1alpha1
kind: Node
metadata: {name: default}
spec:
  type: controlplane
  nodeIP: {addresses: ["fdc8:a1b2:c3d4:ff::13"]}
  vip: {interface: node0}
---
# The node's side of its BGP sessions. The nodes share an AS number, and each has a router ID of
# its own. FRR announces the addresses of node0: the node's own and, while the node holds it, the
# API's VIP.
apiVersion: kubernetes.chalkos.dev/v1alpha1
kind: BGPSpeaker
metadata: {name: bgp}
spec:
  asn: 65001
  routerID: 0.0.0.13
  export: {interfaces: [node0]}
