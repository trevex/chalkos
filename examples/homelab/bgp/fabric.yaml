# The node's two ports and the router, which every node peers with over BGP: a session on each
# port, on which BFD notices a failed port or cable within about a second. Every node gets this
# file, and each node's own file gives its Speaker. The password is a key of the Secret in
# bgp/secrets.yaml.
#
# The ports go by the names the kernel gives them, which follow from the PCI slot and are the same
# on identical machines. Adapt the names to those the addresses diagnostic shows for your machines.
# A node whose ports have other names, as on other hardware, or that peers differently leaves this
# file out and takes a file of its own.
#
# Each port takes an address of the fabric's prefix, the default route, the resolver and the
# NAT64 prefix from the router's advertisements.
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Network
metadata: {name: 20-enp1s0}
spec:
  match: {name: enp1s0}
  network: {ipv6AcceptRA: true}
---
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Network
metadata: {name: 20-enp2s0}
spec:
  match: {name: enp2s0}
  network: {ipv6AcceptRA: true}
---
apiVersion: bgp.example.org/v1alpha1
kind: Peer
metadata: {name: router}
spec:
  address: "fdc8:a1b2:c3d4:1::1"
  asn: 65000
  interfaces: [enp1s0, enp2s0]
  password: {secretRef: {name: bgp, key: password}}
