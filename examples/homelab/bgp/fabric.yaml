# The router, which every node peers with over BGP: a session on each of the node's two ports, on
# which BFD notices a failed port or cable within about a second. Every node gets this file, and
# each node's own file gives its Speaker. A node that peers differently, with other neighbours or
# on other ports, leaves this file out and takes a file of its own. The password is a key of the
# Secret in bgp/secrets.yaml.
apiVersion: bgp.example.org/v1alpha1
kind: Peer
metadata: {name: router}
spec:
  address: "fdc8:a1b2:c3d4:1::1"
  asn: 65000
  interfaces: [fabric0, fabric1]
  password: {secretRef: {name: bgp, key: password}}
