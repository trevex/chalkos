# The node's two ports and the router, which every node peers with over BGP: a session on each
# port, to one of the router's two addresses on the fabric, on which BFD notices a failed port or
# cable within about a second. FRR keys a session by its neighbour's address, so each port's
# session goes to an address of its own, bound to the port. Every node gets this file, and each
# node's own file gives its BGPSpeaker. The password is a key of the Secret in bgp/secrets.yaml.
#
# The ports go by the names fabric-a and fabric-b, which the Link documents in each node's own file
# give them by MAC address, so this file fits every node whatever the kernel calls its ports. A
# node that peers differently leaves this file out and takes a file of its own.
#
# Each port learns its IPv6 address, default gateway, resolver and NAT64 prefix from the
# router's advertisements. The default gateway reaches the workstation and the internet
# before BGP starts. The BGP sessions advertise the node's and API's addresses to the router.
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Network
metadata: {name: 20-fabric-a}
spec:
  match: {name: fabric-a}
  network: {ipv6AcceptRA: true}
---
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Network
metadata: {name: 20-fabric-b}
spec:
  match: {name: fabric-b}
  network: {ipv6AcceptRA: true}
---
apiVersion: kubernetes.chalkos.dev/v1alpha1
kind: BGPPeer
metadata: {name: router-fabric-a}
spec:
  asn: 65000
  import: none
  address: "fdc8:a1b2:c3d4:1::1"
  interfaces: [fabric-a]
  password: {secretRef: {name: bgp, key: password}}
---
apiVersion: kubernetes.chalkos.dev/v1alpha1
kind: BGPPeer
metadata: {name: router-fabric-b}
spec:
  asn: 65000
  import: none
  address: "fdc8:a1b2:c3d4:1::2"
  interfaces: [fabric-b]
  password: {secretRef: {name: bgp, key: password}}
