# Two neighbours, one with a password, on the subnet of the node's uplink.
apiVersion: bgp.example.org/v1alpha1
kind: Peer
metadata: {name: router-a}
spec:
  address: 10.0.0.1
  asn: 64513
  password: {secretRef: {name: bgp, key: password}}
---
apiVersion: bgp.example.org/v1alpha1
kind: Peer
metadata: {name: router-b}
spec: {address: 10.0.0.2, asn: 64514}
---
apiVersion: chalkos.dev/v1alpha1
kind: Secret
metadata: {name: bgp}
spec:
  data: {password: example-password}
---
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Network
metadata: {name: 10-uplink}
spec:
  match: {name: enp1s0}
  network: {address: [10.0.0.11/24], gateway: 10.0.0.1}
