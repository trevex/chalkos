# Kubernetes on IPv6 alone, with the pod range fd00:10:244::/56 and the service range
# fd00:10:96::/112, its defaults. All three nodes are control planes and run workloads too.
apiVersion: kubernetes.chalkos.dev/v1alpha1
kind: Cluster
metadata: {name: default}
spec:
  ipFamilies: [ipv6]
  allowSchedulingOnControlPlanes: true
  # The API server's VIP, which one control plane holds at a time on its interface node0. bird on
  # that node announces it with the node's address, so the VIP's route follows its holder.
  endpoint: "https://[fdc8:a1b2:c3d4:ff::10]:6443"
  vip: {addresses: ["fdc8:a1b2:c3d4:ff::10"], mode: routed}
  # The images of the cluster's components, which containerd pulls as written. The tags of the API
  # server, the controller-manager, the scheduler and kube-proxy follow the kubelet of the image the
  # flake builds, the Kubernetes release of its nixpkgs; the image's checker holds them to
  # Kubernetes's version skew policy. The digests pin what containerd pulls. Read the digest of
  # another reference with `crane digest <ref>` or
  # `skopeo inspect --format '{{.Digest}}' docker://<ref>`. The documentation includes the
  # section the comments --8<-- mark.
  # --8<-- [start:images]
  images:
    apiServer: registry.k8s.io/kube-apiserver:v1.37.1@sha256:e190f914a6cc21cab9268485d1ae7282fdeab1315ac64b668aa42d732fd1061d
    controllerManager: registry.k8s.io/kube-controller-manager:v1.37.1@sha256:d470c1b85aebb466e971c06239cc6a31a4ac337a78600cef80375a79a1be1641
    scheduler: registry.k8s.io/kube-scheduler:v1.37.1@sha256:b6e2474a6c20309f0df1e7337364281fda95c6a0722259ba7f032a1e177d3f29
    proxy: registry.k8s.io/kube-proxy:v1.37.1@sha256:b9ae667ed9c160c9d5b66f55e8afec97fc5483a12db0ada5286541b0385cb9f4
    etcd: registry.k8s.io/etcd:3.7.0-0@sha256:6ecefbe2510c4a30573a62a4d6dd175acf881ca67003fcd91849a16df7a724d5
    coredns: registry.k8s.io/coredns/coredns:v1.14.6@sha256:900f9c109f7a33545d3c811516e8376df9019147b750f5ce3e254468769176ea
    pause: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
    flannel: ghcr.io/flannel-io/flannel:v0.28.9@sha256:708a2c9c1cfbfe529d1dbb249cb7113af117f3ed26b5e3e4c8ee015e10555204
  # --8<-- [end:images]
---
# flannel would take the MTU of node0, the dummy interface that holds the node's address, which
# says nothing of the fabric's. Its VXLAN devices and the pods get spec.mtu less 50 bytes, and
# VXLAN over IPv6 takes 70, so spec.mtu is the fabric's 1500 less 20.
apiVersion: kubernetes.chalkos.dev/v1alpha1
kind: Flannel
metadata: {name: default}
spec:
  mtu: 1480
