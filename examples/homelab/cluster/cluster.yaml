apiVersion: chalkos.dev/v1alpha1
kind: Cluster
metadata: {name: homelab}
spec:
  # cp1's address: the API server of the only control plane.
  endpoint: https://10.0.0.11:6443
---
apiVersion: chalkos.dev/v1alpha1
kind: Image
metadata: {name: node-metal}
spec:
  # nix build .#node-metal -o images/node-metal puts the image here.
  source: {directory: ../images/node-metal}
---
# Kubernetes with its defaults: IPv4, the pod range 10.244.0.0/16 and the service range
# 10.96.0.0/12.
apiVersion: kubernetes.chalkos.dev/v1alpha1
kind: Kubernetes
metadata: {name: kubernetes}
spec: {}
