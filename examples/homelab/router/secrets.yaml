# The router's secrets, as example values. Keep this file out of a public repository, and
# replace the values with your own. The WireGuard key here is public: anyone who read this
# repository holds it and can pose as the router to the workstation. Generate your own with
# wg genkey, and give the workstation its public key from wg pubkey. The BGP password is the one
# bgp/secrets.yaml gives the nodes.
apiVersion: chalkos.dev/v1alpha1
kind: Secret
metadata: {name: wireguard}
spec:
  data: {private: uBjWXU2Bu/LvLVRo+dtAte3VHt75d9W7DPxsEhZrm24=}
---
apiVersion: chalkos.dev/v1alpha1
kind: Secret
metadata: {name: bgp}
spec:
  data: {password: example-password}
