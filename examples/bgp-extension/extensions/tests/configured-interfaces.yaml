# The Peer's and the Speaker's interfaces each have a Network document of their own.
---
apiVersion: bgp.example.org/v1alpha1
kind: Speaker
metadata: {name: bgp}
spec:
  asn: 65001
  routerID: 0.0.0.11
  export: {interfaces: [node0]}
---
apiVersion: bgp.example.org/v1alpha1
kind: Peer
metadata: {name: router}
spec:
  address: "fdc8:a1b2:c3d4:1::1"
  asn: 65000
  interfaces: [fabric-a, fabric-b]
---
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Network
metadata: {name: 20-fabric-a}
spec:
  match: {name: fabric-a}
---
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Network
metadata: {name: 20-fabric-b}
spec:
  match: {name: fabric-b}
---
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Network
metadata: {name: 30-node0}
spec:
  match: {name: node0}
