apiVersion: chalkos.dev/v1alpha1
kind: Cluster
metadata: {name: homelab}
spec: {endpoint: "https://10.0.0.11:6443"}
---
apiVersion: chalkos.dev/v1alpha1
kind: Image
metadata: {name: node-metal}
spec: {source: ./images/node-metal}
---
apiVersion: chalkos.dev/v1alpha1
kind: Node
metadata: {name: cp1}
spec: {type: controlplane, imageRef: node-metal}
---
apiVersion: storage.chalkos.dev/v1alpha1
kind: SystemDisk
metadata: {name: system}
spec:
  disk: {path: /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_2TB_S7KHNJ0W100001}
---
apiVersion: kubernetes.chalkos.dev/v1alpha1
kind: Kubelet
metadata: {name: kubelet}
spec: {}
---
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Network
metadata: {name: 10-uplink}
spec:
  match: {name: enp1s0}
  network: {address: [10.0.0.11/24], gateway: 10.0.0.1}
---
apiVersion: kubernetes.chalkos.dev/v1alpha1
kind: Kubernetes
metadata: {name: kubernetes}
spec: {}
