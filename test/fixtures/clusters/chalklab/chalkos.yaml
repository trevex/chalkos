# The e2e tests' main cluster, whose nodes boot the images of nix/testing/images.nix. The
# tests copy the fixture and link the image directories below images/ that the environment names.
apiVersion: chalkctl.chalkos.dev/v1alpha1
kind: Inventory
metadata: {name: chalklab}
spec:
  images:
    test-metal: {source: {directory: images/test-metal}}
    storage-metal: {source: {directory: images/storage-metal}}
    k8s-kvm: {source: {directory: images/k8s-kvm}}
  files: [cluster/*.yaml]
  groups:
    test: {image: test-metal}
    storage: {image: storage-metal}
    k8s: {image: k8s-kvm, files: [groups/k8s.yaml]}
  nodes:
    chalklab:
      groups: [test]
      files: [nodes/chalklab/node.yaml, nodes/chalklab/system.yaml, nodes/chalklab/greeting.yaml]
    chalklab-target: {groups: [test], files: [nodes/chalklab-target.yaml]}
    chalklab-storage: {groups: [storage], files: [nodes/chalklab-storage.yaml]}
    cp1: {address: 192.168.100.11, groups: [k8s], files: [nodes/cp1.yaml]}
    w1: {address: 192.168.100.12, groups: [k8s], files: [nodes/w1.yaml]}
