# The router e2e test's lab of router-lab.yaml: r1 and r2, routers on the lab's switch, and k1, a
# control plane that peers with r1, with the MAC addresses of their switch NICs and the memory the
# test's budget gives them.
apiVersion: chalklab.chalkos.dev/v1alpha1
kind: Lab
metadata: {name: chalklab-router}
spec:
  inventory: ./router-lab.yaml
  nodes:
    r1: {mac: "52:54:00:00:02:01", memory: 768}
    r2: {mac: "52:54:00:00:02:02", memory: 768}
    k1: {mac: "52:54:00:00:02:03", memory: 1536}
