# The inner router with an address of 2001:db8:100::/64 on its fabric link, peering with r1's
# address there. Its BGP is that of nodes/r2-bgp.yaml. 05-fabric-listen takes the place of
# groups/router.yaml's 10-fabric, which networkd no longer picks for enp0s3.
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Network
metadata: {name: 05-fabric-listen}
spec:
  match: {name: enp0s3}
  network: {address: ["2001:db8:100::2/64"], ipv6AcceptRA: false}
---
apiVersion: router.chalkos.dev/v1alpha1
kind: BGP
metadata: {name: bgp}
spec:
  asn: 64513
  routerID: 192.0.2.2
  networks: [{prefix: "2001:db8:ffff::2/128"}]
---
apiVersion: router.chalkos.dev/v1alpha1
kind: BGPPeer
metadata: {name: edge}
spec:
  address: "2001:db8:100::1"
  remoteAS: 64512
  bfd: true
  password: {secretRef: {name: bgp, key: fabric}}
  families:
    ipv6: {}
