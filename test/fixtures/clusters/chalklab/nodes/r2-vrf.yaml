# r2's BGP in the VRF fabric, whose instance peers with r1 and announces edge0's address. The VRF
# document comes from nodes/r2-fabric-100.yaml or nodes/r2-fabric-200.yaml.
apiVersion: router.chalkos.dev/v1alpha1
kind: BGP
metadata: {name: bgp}
spec:
  vrf: fabric
  asn: 64513
  routerID: 192.0.2.2
  networks: [{prefix: "2001:db8:ffff::2/128"}]
---
apiVersion: router.chalkos.dev/v1alpha1
kind: BGPPeer
metadata: {name: edge}
spec:
  vrf: fabric
  interface: enp0s3
  remoteAS: 64512
  bfd: true
  extendedNextHop: true
  password: {secretRef: {name: bgp, key: fabric}}
  families:
    ipv6: {}
