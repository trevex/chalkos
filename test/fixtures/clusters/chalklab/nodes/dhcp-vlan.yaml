# The VLAN dhcp0, of ID 30, on the routers' fabric link enp0s3. 05-fabric takes the place of
# groups/router.yaml's 10-fabric, which networkd no longer picks for enp0s3, and adds the VLAN.
apiVersion: networkd.chalkos.dev/v1alpha1
kind: NetDev
metadata: {name: 20-dhcp0}
spec:
  netDev: {kind: vlan, name: dhcp0}
  vlan: {id: 30}
---
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Network
metadata: {name: 05-fabric}
spec:
  match: {name: enp0s3}
  network: {ipv6AcceptRA: false, vlan: [dhcp0]}
