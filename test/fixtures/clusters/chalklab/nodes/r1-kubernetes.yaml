# r1's address on the switch for k1's session, and the peer that accepts it: 05-fabric takes the
# place of groups/router.yaml's 10-fabric, which networkd no longer picks for enp0s3. The peer has
# no extendedNextHop, so neither side's FRR sends router advertisements on the switch, where r1's
# unnumbered session with r2 finds its neighbour by them.
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Network
metadata: {name: 05-fabric}
spec:
  match: {name: enp0s3}
  network: {address: ["fd00:300::1/64"], ipv6AcceptRA: false}
---
apiVersion: router.chalkos.dev/v1alpha1
kind: BGPPeer
metadata: {name: kubernetes}
spec:
  listen: {range: "fd00:300::/64"}
  remoteAS: 65031
  bfd: true
  password: {secretRef: {name: bgp, key: fabric}}
  families:
    ipv6: {defaultOriginate: true}
