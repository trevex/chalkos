# The inner router's edge0, whose address it announces and which its connections through r1's
# NAT64 and its queries to r1's resolver come from. nodes/r2-bgp.yaml gives it BGP.
apiVersion: networkd.chalkos.dev/v1alpha1
kind: NetDev
metadata: {name: 20-edge0}
spec:
  netDev: {kind: dummy, name: edge0}
---
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Network
metadata: {name: 20-edge0}
spec:
  match: {name: edge0}
  network: {address: ["2001:db8:ffff::2/128"]}
