# The inner router: IPv6-only on the switch, it learns its default route from r1.
apiVersion: router.chalkos.dev/v1alpha1
kind: BGP
metadata: {name: bgp}
spec:
  asn: 64513
  routerID: 192.0.2.2
---
apiVersion: router.chalkos.dev/v1alpha1
kind: BGPPeer
metadata: {name: edge}
spec:
  interface: enp0s3
  remoteAS: 64512
  bfd: true
  extendedNextHop: true
  password: {secretRef: {name: bgp, key: fabric}}
  families:
    ipv6: {}
