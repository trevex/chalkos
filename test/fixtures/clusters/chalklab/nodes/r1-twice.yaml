# A second peer of r1's fabric session, beside nodes/r1-peer.yaml's. The session's neighbour is
# derived from the peers' interfaces and the links they match, so no rule and no uniqueness
# declaration compares it, and chalkctl validate accepts the config; the frr output's renderer
# refuses two peers of one session.
apiVersion: router.chalkos.dev/v1alpha1
kind: BGPPeer
metadata: {name: again}
spec:
  interface: enp0s3
  remoteAS: external
  families:
    ipv6: {}
