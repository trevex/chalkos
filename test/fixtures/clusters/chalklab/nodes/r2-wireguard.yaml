# The inner router with an address of 2001:db8:101::/64 on its fabric link and the WireGuard wg0,
# which dials r1's address there and keeps the tunnel open. 05-fabric-wireguard takes the place of
# groups/router.yaml's 10-fabric, which networkd no longer picks for enp0s3. The keys are the
# test's alone.
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Network
metadata: {name: 05-fabric-wireguard}
spec:
  match: {name: enp0s3}
  network: {address: ["2001:db8:101::2/64"], ipv6AcceptRA: false}
---
apiVersion: router.chalkos.dev/v1alpha1
kind: WireGuard
metadata: {name: wg0}
spec:
  addresses: ["fd00:f0::2/64"]
  privateKey: {secretRef: {name: wireguard, key: private}}
---
apiVersion: router.chalkos.dev/v1alpha1
kind: WireGuardPeer
metadata: {name: r1}
spec:
  interface: wg0
  publicKey: uLRrWL5pg3FX2ydGsAsUrQ/VvWautg0OJpoJEGP12XM=
  allowedIPs: ["fd00:f0::/64"]
  endpoint: "[2001:db8:101::1]:51820"
  persistentKeepalive: 5
---
apiVersion: chalkos.dev/v1alpha1
kind: Secret
metadata: {name: wireguard}
spec:
  data: {private: KBjI8uzDpVaQ7UjdF47UC86nLL1Y4FWJT1L9mRvwcnM=}
