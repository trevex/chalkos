# The main cluster with a new encrypted volume on an empty disk for chalklab, an additive
# change, and another Greeting, whose consumer restarts.
apiVersion: chalkctl.chalkos.dev/v1alpha1
kind: Inventory
metadata: {name: chalklab}
spec:
  images:
    test-metal: {source: {directory: images/test-metal}}
  files: [cluster/*.yaml]
  groups:
    test: {image: test-metal}
  nodes:
    chalklab:
      groups: [test]
      files: [nodes/chalklab/node.yaml, nodes/chalklab/system.yaml, nodes/chalklab/extra.yaml]
