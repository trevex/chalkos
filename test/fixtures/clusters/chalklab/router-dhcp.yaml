# The main cluster's routers with a macvlan dhcp0 on their fabric link: r1 serves DHCP on its
# dhcp0, in the VRF lan, and r2 takes its dhcp0's address from it.
apiVersion: chalkctl.chalkos.dev/v1alpha1
kind: Inventory
metadata: {name: chalklab}
spec:
  images:
    router-kvm: {source: {directory: images/router-kvm}}
  all: {files: [cluster/*.yaml]}
  groups:
    router: {imageName: router-kvm, files: [groups/router.yaml]}
  nodes:
    r1: {groups: [router], files: [nodes/r1.yaml, nodes/r1-bgp.yaml, nodes/r1-peer.yaml, nodes/dhcp-fabric.yaml, nodes/r1-dhcp.yaml]}
    r2: {groups: [router], files: [nodes/r2.yaml, nodes/r2-bgp.yaml, nodes/dhcp-fabric.yaml, nodes/r2-dhcp.yaml]}
