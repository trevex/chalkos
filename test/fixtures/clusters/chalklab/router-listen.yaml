# The main cluster's routers with global addresses on their fabric link: r1 accepts a session
# from every address of the link's prefix, and r2 peers with r1's address.
apiVersion: chalkctl.chalkos.dev/v1alpha1
kind: Inventory
metadata: {name: chalklab}
spec:
  images:
    router-kvm: {source: {directory: images/router-kvm}}
  all: {files: [cluster/*.yaml]}
  groups:
    router: {imageName: router-kvm, files: [groups/router.yaml]}
  nodes:
    r1: {groups: [router], files: [nodes/r1.yaml, nodes/r1-bgp.yaml, nodes/r1-listen.yaml]}
    r2: {groups: [router], files: [nodes/r2.yaml, nodes/r2-listen.yaml]}
