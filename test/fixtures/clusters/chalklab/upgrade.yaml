# The main cluster with chalklab on the upgrade image of the e2e upgrade test, whose Farewell kind
# the test image does not have: config only the upgrade image accepts.
apiVersion: chalkctl.chalkos.dev/v1alpha1
kind: Inventory
metadata: {name: chalklab}
spec:
  images:
    test-upgrade-metal: {source: {directory: images/test-upgrade-metal}}
  files: [cluster/*.yaml]
  groups:
    test-upgrade: {image: test-upgrade-metal}
  nodes:
    chalklab:
      groups: [test-upgrade]
      files: [nodes/chalklab/node.yaml, nodes/chalklab/system.yaml, nodes/chalklab/greeting.yaml, nodes/chalklab/farewell.yaml]
