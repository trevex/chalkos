# The main cluster's r1 with an address on the switch, a peer of k1's AS, which k1 peers with, and
# a time server there, and k1 announcing lb0's address as well and taking its time from r1. r1
# keeps the test's NTP server of cluster/time.yaml, which k1-time.yaml replaces for k1.
apiVersion: chalkctl.chalkos.dev/v1alpha1
kind: Inventory
metadata: {name: chalklab}
spec:
  images:
    k8s-kvm: {source: {directory: images/k8s-kvm}}
    router-kvm: {source: {directory: images/router-kvm}}
  groups:
    k8s-bgp: {imageName: k8s-kvm, files: [groups/k8s-bgp.yaml, groups/registries.yaml]}
    router: {imageName: router-kvm, files: [cluster/*.yaml, groups/router.yaml]}
  nodes:
    r1: {groups: [router], files: [nodes/r1.yaml, nodes/r1-bgp.yaml, nodes/r1-peer.yaml, nodes/r1-kubernetes.yaml]}
    k1: {groups: [k8s-bgp], files: [nodes/k1.yaml, nodes/k1-lb.yaml, nodes/k1-time.yaml]}
