# The main cluster with VAR of a fixed size where it filled chalklab's disk: a destructive change.
apiVersion: chalkctl.chalkos.dev/v1alpha1
kind: Inventory
metadata: {name: chalklab}
spec:
  images:
    test-metal: {source: {directory: images/test-metal}}
  files: [cluster/*.yaml]
  groups:
    test: {image: test-metal}
  nodes:
    chalklab:
      groups: [test]
      files: [nodes/chalklab/greeting-token.yaml, nodes/chalklab/var-1g.yaml, nodes/chalklab/greeting.yaml]
