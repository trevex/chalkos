# The router lab's cluster of one control plane, k1: IPv6 alone, its API's VIP routed. k1's BGP
# speaker announces the VIP while k1 holds it.
apiVersion: kubernetes.chalkos.dev/v1alpha1
kind: Cluster
metadata: {name: default}
spec:
  ipFamilies: [ipv6]
  allowSchedulingOnControlPlanes: true
  endpoint: "https://[fd00:301::10]:6443"
  vip: {addresses: ["fd00:301::10"], mode: routed}
  # The images the test's registry serves, as groups/k8s.yaml names them.
  images:
    apiServer: registry.k8s.io/kube-apiserver:v1.37.2@sha256:f3916d65eddfe52b6d21ff4a17abdf4c52589c8ef62ec7e0c17204f276cd8db6
    controllerManager: registry.k8s.io/kube-controller-manager:v1.37.2@sha256:07fccf8e84f4cdc72c8e59f1a50da68f15acf1299e455004a944610aecac60c4
    coredns: registry.k8s.io/coredns/coredns:v1.14.6@sha256:1ba6f47265602e2e50a9c4669e3a955e4298a0d30dc82f39293d4bf1a851e0ff
    etcd: registry.k8s.io/etcd:3.7.0-0@sha256:1f445fa5dd06b08f3c0cf9f46e2891e9bc66cbf7e0b9c66627c40658edf4bc98
    flannel: ghcr.io/flannel-io/flannel:v0.28.9@sha256:d666a036197fe6c8928f82b670d89f38f5830d25e70bfcc35641da06f03cfcad
    pause: registry.k8s.io/pause:3.10.2@sha256:412c4a7219cb8a299a37337f3d87810c5340095322e15594a1637785adad0f17
    proxy: registry.k8s.io/kube-proxy:v1.37.2@sha256:8c355aac6f4397e98a5462d4bb47b55386df688e6e1e46c67bf374155ac02c45
    scheduler: registry.k8s.io/kube-scheduler:v1.37.2@sha256:e5438c1bb8c569c41ad556d8a1e8eba44fc5b3cfe4da3adf2a17168102434074
