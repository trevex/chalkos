# Dual stack.
apiVersion: kubernetes.chalkos.dev/v1alpha1
kind: Cluster
metadata: {name: default}
spec:
  allowSchedulingOnControlPlanes: true
  dnsIPs:
    ipv4: 10.96.0.10
    ipv6: fd00:10:96::a
  domain: cluster.local
  endpoint: https://192.168.100.11:6443
  extraArgs:
    etcd: {}
    kube-apiserver: {}
    kube-controller-manager: {}
    kube-scheduler: {}
  # The images the test's registry serves, by the digests of their amd64 manifests, which
  # nix/testing/kubernetes-images.nix pins.
  images:
    apiServer: registry.k8s.io/kube-apiserver:v1.37.1@sha256:1f207ab66b1ca6579dd5bf1024396015ca2a0f638157a7741d2d88d7b3c82c51
    controllerManager: registry.k8s.io/kube-controller-manager:v1.37.1@sha256:24366808a9bf9dfefb3aa171f0fadac61a1dde50a43e578c42eb3d8785cb606e
    coredns: registry.k8s.io/coredns/coredns:v1.14.6@sha256:1ba6f47265602e2e50a9c4669e3a955e4298a0d30dc82f39293d4bf1a851e0ff
    etcd: registry.k8s.io/etcd:3.7.0-0@sha256:1f445fa5dd06b08f3c0cf9f46e2891e9bc66cbf7e0b9c66627c40658edf4bc98
    flannel: ghcr.io/flannel-io/flannel:v0.28.9@sha256:d666a036197fe6c8928f82b670d89f38f5830d25e70bfcc35641da06f03cfcad
    pause: registry.k8s.io/pause:3.10.2@sha256:412c4a7219cb8a299a37337f3d87810c5340095322e15594a1637785adad0f17
    proxy: registry.k8s.io/kube-proxy:v1.37.1@sha256:abbadc84931b520750bcda3350819f6a828ee44a4a0cab548a26016aa7e2a3b7
    scheduler: registry.k8s.io/kube-scheduler:v1.37.1@sha256:e4fc6f552722518aaa7d6cddbb8b638df275a5adbc5d1e5d59276af52692fb2c
  ipFamilies:
    - ipv4
    - ipv6
  nodeCIDRMaskSizes:
    ipv4: 24
    ipv6: 64
  nodeIP:
    timeout: 300
    validSubnets: []
  podCIDRs:
    ipv4: 10.244.0.0/16
    ipv6: fd00:10:244::/56
  serviceCIDRs:
    ipv4: 10.96.0.0/12
    ipv6: fd00:10:96::/112
  vip:
    addresses: []
    mode: l2
---
# w1's addresses are on a dummy interface, whose MTU flannel would take: the cluster network's
# 1500 less IPv6's VXLAN overhead of 70. The cluster network and w1's routed addresses take VXLAN.
apiVersion: kubernetes.chalkos.dev/v1alpha1
kind: Flannel
metadata: {name: default}
spec:
  mtu: 1430
  vxlanSourceSubnets:
    - 192.168.100.0/24
    - fd00:100::/64
    - 192.168.200.0/24
    - fd00:200::/64
---
# The nodes pull every image through the test's registry, which serves plain HTTP.
apiVersion: oci.chalkos.dev/v1alpha1
kind: Registry
metadata: {name: e2e}
spec:
  host: "10.0.2.100:5000"
  insecure: true
---
apiVersion: oci.chalkos.dev/v1alpha1
kind: Mirror
metadata: {name: docker.io}
spec:
  endpoints:
    - http://10.0.2.100:5000
  registry: docker.io
---
apiVersion: oci.chalkos.dev/v1alpha1
kind: Mirror
metadata: {name: ghcr.io}
spec:
  endpoints:
    - http://10.0.2.100:5000
  registry: ghcr.io
---
apiVersion: oci.chalkos.dev/v1alpha1
kind: Mirror
metadata: {name: registry.k8s.io}
spec:
  endpoints:
    - http://10.0.2.100:5000
  registry: registry.k8s.io
---
# A private registry the nodes reach only through the test's registry, which asks for these
# credentials. The kubelet gives them to containerd, which sends them to the mirror endpoint;
# no pod names a pull secret.
apiVersion: oci.chalkos.dev/v1alpha1
kind: Mirror
metadata: {name: private}
spec:
  endpoints:
    - http://10.0.2.100:5000
  registry: private.chalkos.test
---
apiVersion: oci.chalkos.dev/v1alpha1
kind: Registry
metadata: {name: private}
spec:
  host: private.chalkos.test
  username: e2e
  password: {secretRef: {name: registry, key: password}}
---
apiVersion: chalkos.dev/v1alpha1
kind: Secret
metadata: {name: registry}
spec:
  data: {password: pull-s3cret}
