apiVersion: storage.chalkos.dev/v1alpha1
kind: SystemDisk
metadata: {name: system}
spec:
  disk:
    path: /dev/vda
  encryption:
    fallback: recovery-key
    mode: tpm2
  var:
    encryption:
      mode: tpm2
---
apiVersion: networkd.chalkos.dev/v1alpha1
kind: Network
metadata: {name: 10-cluster}
spec:
  match:
    macAddress: "52:54:00:00:02:13"
  network:
    address:
      - 192.168.100.13/24
      - fd00:100::13/64
---
apiVersion: kubernetes.chalkos.dev/v1alpha1
kind: Node
metadata: {name: default}
spec:
  type: controlplane
  kubeletExtraArgs: {}
  labels: {}
  nodeIP:
    addresses:
      - fd00:100::13
  taints: []
