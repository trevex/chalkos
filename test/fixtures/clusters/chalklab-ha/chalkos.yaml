# The e2e tests' HA cluster: three control planes of an IPv6-only cluster behind the VIP
# fd00:100::10, on the switch of the HA test.
apiVersion: chalkctl.chalkos.dev/v1alpha1
kind: Inventory
metadata: {name: chalklab-ha}
spec:
  images:
    k8s-metal: {source: {directory: images/k8s-metal}}
  all: {imageName: k8s-metal, files: [cluster/*.yaml]}
  nodes:
    cp1: {address: 192.168.100.11, files: [nodes/cp1.yaml]}
    cp2: {address: 192.168.100.12, files: [nodes/cp2.yaml]}
    cp3: {address: 192.168.100.13, files: [nodes/cp3.yaml]}
