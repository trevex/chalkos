          { "fish" = "reference/cli/chalkctl_completion_fish.md" },
          { "powershell" = "reference/cli/chalkctl_completion_powershell.md" },
          { "zsh" = "reference/cli/chalkctl_completion_zsh.md" },
        ] },
        { "config" = [
