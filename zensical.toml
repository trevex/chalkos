# The chalkos documentation site, built with Zensical: nix build .#docs builds it, nix run
# .#docs-serve serves it while it is edited. Zensical's default Markdown extensions stay on; they
# give admonitions, content tabs, Mermaid diagrams in superfences and code highlighting.
[project]
site_name = "chalkos"
site_description = "An image-based NixOS for Kubernetes nodes, with Secure Boot, a TPM and A/B upgrades"
site_url = "https://trevex.github.io/chalkos/"
repo_url = "https://github.com/trevex/chalkos"
repo_name = "trevex/chalkos"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/chalkos.css"]
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/index.md",
    "getting-started/requirements.md",
    "getting-started/five-minutes.md",
  ] },
  { "Concepts" = [
    "concepts/index.md",
    "concepts/architecture.md",
    "concepts/cluster-definition.md",
    "concepts/image.md",
    "concepts/boot-and-rollback.md",
    "concepts/security.md",
    "concepts/certificates.md",
    "concepts/storage.md",
    "concepts/networking.md",
    "concepts/kubernetes.md",
    "concepts/upgrades.md",
  ] },
  { "Guides" = [
    "guides/index.md",
    "guides/install-bare-metal.md",
    "guides/kvm-proxmox-libvirt.md",
    "guides/production-cluster.md",
    "guides/ha-control-plane.md",
    "guides/customise-role.md",
    "guides/customise-installer.md",
    "guides/additional-hardware.md",
    "guides/storage-volumes.md",
    "guides/upgrade-cluster.md",
    "guides/rotate-certificates.md",
    "guides/secure-boot-signing.md",
    "guides/recover-node.md",
    "guides/troubleshooting.md",
  ] },
  { "Reference" = [
    "reference/index.md",
    # The commands' pages, which nix run .#docgen writes from their help.
    # BEGIN docgen cli
    { "Command line" = [
      "reference/cli/index.md",
      { "chalkctl" = [
        { "Overview" = "reference/cli/chalkctl.md" },
        { "apply-identity" = "reference/cli/chalkctl_apply-identity.md" },
        { "bootstrap" = "reference/cli/chalkctl_bootstrap.md" },
        { "completion" = [
          { "Overview" = "reference/cli/chalkctl_completion.md" },
