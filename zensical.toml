          { "remove-member" = "reference/cli/chalkctl_etcd_remove-member.md" },
        ] },
        { "gen" = [
          { "Overview" = "reference/cli/chalkctl_gen.md" },
          { "secrets" = "reference/cli/chalkctl_gen_secrets.md" },
        ] },
        { "install" = "reference/cli/chalkctl_install.md" },
        { "kubeconfig" = "reference/cli/chalkctl_kubeconfig.md" },
        { "logs" = "reference/cli/chalkctl_logs.md" },
        { "node" = [
          { "Overview" = "reference/cli/chalkctl_node.md" },
          { "renew" = "reference/cli/chalkctl_node_renew.md" },
        ] },
