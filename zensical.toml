        { "rotate" = "reference/cli/chalkctl_rotate.md" },
        { "sign" = "reference/cli/chalkctl_sign.md" },
        { "status" = "reference/cli/chalkctl_status.md" },
        { "storage" = [
          { "Overview" = "reference/cli/chalkctl_storage.md" },
          { "reset" = "reference/cli/chalkctl_storage_reset.md" },
        ] },
        { "upgrade" = "reference/cli/chalkctl_upgrade.md" },
      ] },
      { "chalklab" = [
        { "Overview" = "reference/cli/chalklab.md" },
