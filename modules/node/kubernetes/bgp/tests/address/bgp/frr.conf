! FRR's config, rendered by chalkos-render kubernetes-frr. frr.service fills in the passwords, and
! chalkos-frr-reload applies the changes.
frr defaults traditional
hostname example
log syslog informational
service integrated-vtysh-config
!
ip prefix-list default-ipv4 seq 5 permit 0.0.0.0/0
ipv6 prefix-list default-ipv6 seq 5 permit ::/0
!
bgp as-path access-list local seq 5 permit ^$
!
route-map announce permit 10
 match as-path local
exit
route-map export permit 10
 match interface eth0
exit
route-map import-ipv4 permit 10
 match ip address prefix-list default-ipv4
exit
route-map import-ipv6 permit 10
 match ipv6 address prefix-list default-ipv6
exit
route-map import-none deny 10
exit
!
router bgp 65001
 bgp router-id 192.0.2.11
 no bgp default ipv4-unicast
 neighbor peer-tor-v4 peer-group
 neighbor peer-tor-v4 remote-as 65000
 neighbor peer-tor-v4 disable-connected-check
 neighbor peer-tor-v4 timers connect 10
 neighbor 192.0.2.1 peer-group peer-tor-v4
 neighbor peer-tor-v6 peer-group
 neighbor peer-tor-v6 remote-as 65000
 neighbor peer-tor-v6 bfd
 neighbor peer-tor-v6 disable-connected-check
 neighbor peer-tor-v6 timers connect 10
 neighbor 2001:db8::1 peer-group peer-tor-v6
 !
 address-family ipv4 unicast
  redistribute connected route-map export
  maximum-paths 16
  neighbor peer-tor-v4 activate
  neighbor peer-tor-v4 route-map import-none in
  neighbor peer-tor-v4 route-map announce out
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected route-map export
  maximum-paths 16
  neighbor peer-tor-v6 activate
  neighbor peer-tor-v6 route-map import-ipv6 in
  neighbor peer-tor-v6 route-map announce out
 exit-address-family
exit
!
end
