! FRR's config, rendered by chalkos-render kubernetes-frr. frr.service fills in the passwords, and
! frr-reload.py applies the changes.
frr defaults traditional
hostname example
log syslog informational
service integrated-vtysh-config
!
ip prefix-list default-ipv4 seq 5 permit 0.0.0.0/0
ipv6 prefix-list default-ipv6 seq 5 permit ::/0
!
bgp as-path access-list local seq 5 permit ^$
!
route-map announce permit 10
 match as-path local
exit
route-map export permit 10
 match interface node0
exit
route-map import-ipv4 permit 10
 match ip address prefix-list default-ipv4
exit
route-map import-ipv6 permit 10
 match ipv6 address prefix-list default-ipv6
exit
route-map import-none deny 10
exit
!
interface enp1s0
 ipv6 nd ra-lifetime 0
exit
interface fabric0
 ipv6 nd ra-lifetime 0
exit
!
router bgp 65001
 bgp router-id 0.0.0.11
 no bgp default ipv4-unicast
 neighbor peer-fabric peer-group
 neighbor peer-fabric remote-as 65000
 neighbor peer-fabric bfd
 neighbor peer-fabric timers connect 10
 neighbor fabric0 interface peer-group peer-fabric
 neighbor peer-router peer-group
 neighbor peer-router remote-as 65000
 neighbor peer-router bfd
 neighbor peer-router timers connect 10
 neighbor peer-router capability extended-nexthop
 neighbor fdc8:a1b2:c3d4:1::1 peer-group peer-router
 neighbor fdc8:a1b2:c3d4:1::1 interface enp1s0
 neighbor peer-switch peer-group
 neighbor peer-switch remote-as 65002
 neighbor peer-switch timers connect 10
 neighbor fdc8:a1b2:c3d4:2::1 peer-group peer-switch
 !
 address-family ipv4 unicast
  redistribute connected route-map export
  maximum-paths 16
  neighbor peer-fabric activate
  neighbor peer-fabric route-map import-ipv4 in
  neighbor peer-fabric route-map announce out
  neighbor peer-router activate
  neighbor peer-router route-map import-ipv4 in
  neighbor peer-router route-map announce out
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected route-map export
  maximum-paths 16
  neighbor peer-fabric activate
  neighbor peer-fabric route-map import-ipv6 in
  neighbor peer-fabric route-map announce out
  neighbor peer-router activate
  neighbor peer-router route-map import-ipv6 in
  neighbor peer-router route-map announce out
  neighbor peer-switch activate
  neighbor peer-switch route-map import-none in
  neighbor peer-switch route-map announce out
 exit-address-family
exit
!
end
