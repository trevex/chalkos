# Releases the cluster's images when a tag v<version> is pushed. Each package <image>-oci of the
# flake is built as an OCI layout, signed for Secure Boot when the repository has the secrets
# DB_KEY and DB_CERT, pushed to ghcr.io/<owner>/<image>:<tag>, signed with cosign and attested.
# The last job adds each image's reference with its digest to the tag's GitHub release.
name: release-images

on:
  push:
    tags: ["v*"]

# One release of a tag at a time, and a running release is never cancelled.
concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Checks the tag against version.nix and flake.lock against flake.nix, and lists the images.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: List the images
        id: plan
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version=$(nix eval --raw --file version.nix)
          if [ "$TAG" != "v$version" ]; then
            echo "::error title=Wrong tag::the tag is $TAG, but version.nix names $version"
            exit 1
          fi
          # --no-update-lock-file fails when flake.lock does not lock what flake.nix names.
          images=$(nix eval --json --no-update-lock-file .#packages.x86_64-linux --apply builtins.attrNames |
            jq -c --arg owner "${OWNER,,}" \
              '[.[] | select(endswith("-oci")) | rtrimstr("-oci") | {name: ., repository: "ghcr.io/\($owner)/\(.)"}]')
          if [ "$images" = "[]" ]; then
            echo "::error title=No images::the flake has no package named <image>-oci"
            exit 1
          fi
          jq . <<<"$images"
          echo "images=$images" >>"$GITHUB_OUTPUT"

  # Builds an image's layout, signs it for Secure Boot if the secrets are set, pushes it, signs
  # the pushed digest with cosign and attests its provenance in the registry.
  image:
    needs: plan
    name: image ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A metal image and its build take more than the runner's free disk.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # Optional: a Cachix cache, once the repository variable CACHIX_NAME names it.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_NAME != ''
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the layout
        env:
          NAME: ${{ matrix.name }}
        run: |
          nix build --print-build-logs -o oci ".#$NAME-oci"
          # The chalkbuild of the chalkos that flake.lock locks.
          nix build --inputs-from . -o chalkbuild chalkos#chalkbuild
      - name: Sign the layout for Secure Boot
        env:
          DB_KEY: ${{ secrets.DB_KEY }}
          DB_CERT: ${{ secrets.DB_CERT }}
        run: |
          if [ -z "$DB_KEY" ]; then
            echo "No secret DB_KEY: the image is not signed for Secure Boot"
            exit 0
          fi
          umask 077
          printf '%s\n' "$DB_KEY" >"$RUNNER_TEMP/db.key"
          printf '%s\n' "$DB_CERT" >"$RUNNER_TEMP/db.crt"
          chalkbuild/bin/chalkbuild sign --key "$RUNNER_TEMP/db.key" --cert "$RUNNER_TEMP/db.crt" oci oci-signed
          rm "$RUNNER_TEMP/db.key"
      - name: Push the layout
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ matrix.repository }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ matrix.name }}
        run: |
          layout=oci
          if [ -d oci-signed ]; then
            layout=oci-signed
          fi
          digest=$(jq -r '.manifests[0].digest' "$layout/index.json")
          docker login ghcr.io --username "$ACTOR" --password-stdin <<<"$GH_TOKEN"
          pushed=$(chalkbuild/bin/chalkbuild push "$layout" "$REPOSITORY:$TAG")
          if [ "$pushed" != "$REPOSITORY@$digest" ]; then
            echo "::error title=Wrong digest::chalkbuild pushed $pushed, not $REPOSITORY@$digest"
            exit 1
          fi
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          mkdir image
          jq -n --arg name "$NAME" --arg reference "$REPOSITORY:$TAG@$digest" \
            '{$name, $reference}' >"image/$NAME.json"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image with cosign
        env:
          REPOSITORY: ${{ matrix.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REPOSITORY@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records exist for organisations' repositories alone.
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.name }}
          path: image/
          retention-days: 7

  # Adds the images' references with their digests to the tag's release, and creates the release
  # if the tag has none.
  notes:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - name: Add the images to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo '<!-- release images -->'
            echo '## Images'
            echo
            echo '```text'
            jq -rs 'sort_by(.name) | .[].reference' images/*.json
            echo '```'
          } >section.md
          cat section.md >>"$GITHUB_STEP_SUMMARY"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A run again replaces the section it added before.
            gh release view "$TAG" --json body --jq .body | sed '/^<!-- release images -->$/,$d' >notes.md
            { echo; cat section.md; } >>notes.md
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file section.md
          fi
