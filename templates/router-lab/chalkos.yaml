# The lab's two nodes, the image each runs and its config file. chalklab reaches the nodes at ports
# it forwards from 127.0.0.1, through the inventory it writes into the lab's state directory, so
# the nodes need no address here.
apiVersion: chalkctl.chalkos.dev/v1alpha1
kind: Inventory
metadata: {name: router-lab}
spec:
  images:
    # The router image of this chalkos release for VMs, which chalklab pulls by the digest its tag
    # names. To run your own builds of flake.nix instead, take the sources
    # {directory: images/router-kvm} and {directory: images/client-kvm} and run
    # nix build .#router-kvm -o images/router-kvm and nix build .#client-kvm -o images/client-kvm.
    router-kvm: {source: {oci: ghcr.io/trevex/chalkos/router-kvm:v0.1.0}} # x-release-please-version
  nodes:
    router: {imageName: router-kvm, files: [nodes/router.yaml]}
    client: {imageName: router-kvm, files: [nodes/client.yaml]}
